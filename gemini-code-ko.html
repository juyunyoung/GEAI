<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative AI Leader 모의시험</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2433; --sub:#5b6478;
    --line:#e3e7f0; --brand:#1a73e8; --brand-d:#1558c0;
    --green:#188038; --green-bg:#e6f4ea; --red:#c5221f; --red-bg:#fce8e6;
    --amber:#e37400; --shadow:0 1px 3px rgba(20,30,60,.08),0 8px 24px rgba(20,30,60,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 22px}
  h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.3px}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--brand);background:#e8f0fe;
    padding:4px 10px;border-radius:999px;margin-bottom:14px}
  p.lead{color:var(--sub);margin:.2rem 0 1.4rem;font-size:.95rem}
  .opt-group{margin:18px 0}
  .opt-group h3{font-size:.85rem;color:var(--sub);font-weight:600;margin:0 0 8px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:90px;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:11px 10px;border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s}
  .seg button.active{border-color:var(--brand);background:#e8f0fe;color:var(--brand-d)}
  .seg button:hover{border-color:var(--brand)}
  .btn{display:inline-block;width:100%;border:none;background:var(--brand);color:#fff;font-size:1rem;
    font-weight:700;padding:14px;border-radius:14px;cursor:pointer;margin-top:18px;transition:.15s}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
  .btn.ghost:hover{background:#f0f5ff}
  .btn-row{display:flex;gap:10px}
  .btn-row .btn{margin-top:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:.82rem;color:var(--sub)}
  .bar{height:8px;background:#e8ebf3;border-radius:999px;overflow:hidden;margin-bottom:20px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#4285f4,#1a73e8);border-radius:999px;transition:width .3s}
  .qnum{font-weight:700;color:var(--ink)}
  .qtext{font-size:1.08rem;font-weight:600;margin:6px 0 6px;letter-spacing:-.2px}
  #hint{font-size:.82rem;color:var(--brand-d);font-weight:700;margin:0 0 14px;min-height:0}
  #hint:empty{margin:0}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);background:#fff;
    border-radius:14px;padding:14px 14px;cursor:pointer;transition:.12s;text-align:left;font-size:.97rem;width:100%}
  .choice:hover{border-color:var(--brand);background:#fafcff}
  .choice .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #c6ccd8;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff}
  .choice.sel{border-color:var(--brand);background:#e8f0fe}
  .choice.sel .dot{border-color:var(--brand);background:var(--brand)}
  .choice.correct{border-color:var(--green);background:var(--green-bg)}
  .choice.correct .dot{border-color:var(--green);background:var(--green)}
  .choice.wrong{border-color:var(--red);background:var(--red-bg)}
  .choice.wrong .dot{border-color:var(--red);background:var(--red)}
  .choice[disabled]{cursor:default}
  .explain{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:.92rem;display:none}
  .explain.show{display:block}
  .explain.ok{background:var(--green-bg);border:1px solid #b7e1c1}
  .explain.no{background:var(--red-bg);border:1px solid #f3c0bd}
  .explain b{display:block;margin-bottom:4px}
  .explain .ans{color:var(--green);font-weight:700}
  .score-ring{width:150px;height:150px;margin:6px auto 14px;border-radius:50%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:conic-gradient(var(--brand) var(--p),#e8ebf3 0)}
  .score-ring > div{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  .score-ring .pct{font-size:2rem;font-weight:800;line-height:1}
  .score-ring .sub{font-size:.78rem;color:var(--sub)}
  .verdict{text-align:center;font-size:1.15rem;font-weight:800;margin:6px 0}
  .verdict.pass{color:var(--green)} .verdict.fail{color:var(--amber)}
  .stat{display:flex;justify-content:center;gap:24px;margin:14px 0 4px;font-size:.9rem;color:var(--sub)}
  .stat b{display:block;font-size:1.3rem;color:var(--ink)}
  .review h3{font-size:1rem;margin:22px 0 10px}
  .rev-item{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:.9rem}
  .rev-item .q{font-weight:600;margin-bottom:7px}
  .rev-item .yours{color:var(--red)} .rev-item .right{color:var(--green);font-weight:600}
  .rev-item .ex{color:var(--sub);margin-top:6px;font-size:.86rem}
  .hide{display:none}
  .foot{text-align:center;color:#9aa3b6;font-size:.75rem;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">

  <section id="start" class="card">
    <span class="tag">Google Cloud · 자격증 대비</span>
    <h1>Generative AI Leader 모의시험</h1>
    <p class="lead">실제 연습문제 207문항 기반. 반복 응시·자동 채점·해설을 제공합니다.</p>

    <div class="opt-group">
      <h3>문항 수</h3>
      <div class="seg" id="seg-count">
        <button data-v="20">20문항</button>
        <button data-v="40">40문항</button>
        <button class="active" data-v="207">전체 207문항</button>
      </div>
    </div>

    <div class="opt-group">
      <h3>채점 방식</h3>
      <div class="seg" id="seg-mode">
        <button class="active" data-v="instant">즉시 해설 (학습용)</button>
        <button data-v="exam">마지막 일괄 채점 (실전)</button>
      </div>
    </div>

    <div class="opt-group">
      <h3>문제 순서</h3>
      <div class="seg" id="seg-shuffle">
        <button class="active" data-v="1">랜덤 셔플</button>
        <button data-v="0">고정 순서</button>
      </div>
    </div>

    <button class="btn" onclick="startExam()">시험 시작</button>
    <div class="foot">합격 기준선은 학습 편의를 위해 75%로 설정되어 있습니다.</div>
  </section>

  <section id="quiz" class="card hide">
    <div class="topbar">
      <span class="qnum" id="qcount"></span>
      <span id="modeLabel"></span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="qtext" id="qtext"></div>
    <div id="hint"></div>
    <div class="choices" id="choices"></div>
    <div class="explain" id="explain"></div>
    <button class="btn hide" id="nextBtn">다음</button>
  </section>

  <section id="result" class="card hide">
    <div class="score-ring" id="ring"><div>
      <span class="pct" id="pct"></span><span class="sub" id="ratio"></span>
    </div></div>
    <div class="verdict" id="verdict"></div>
    <div class="stat">
      <div>맞힘<b id="nCorrect"></b></div>
      <div>틀림<b id="nWrong"></b></div>
    </div>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn ghost" onclick="location.reload()">설정 변경</button>
      <button class="btn" onclick="retry()">다시 풀기</button>
    </div>
    <div class="review" id="review"></div>
  </section>

  <div class="foot">© 연습용 시뮬레이터 · 실제 Google 시험 문제가 아닌 학습 보조 자료입니다.</div>
</div>

<script>
/* ===== 문제 데이터 (207문항 전체, 병합·중복제거 완료) ===== */
const BANK = [{"q": "인사부서가 채용 지원서를 선별하는 생성형 AI 모델을 배포했습니다. 적격으로 보이는 일부 지원자가 계속 탈락하지만 AI는 순위·제외 사유를 설명하지 않습니다. 이 투명성 부족 문제를 해결하려면?", "o": ["더 크고 다양한 데이터셋을 수집한다.", "생성형 AI 모델을 파인튜닝한다.", "설명 가능한(explainable) 생성형 AI 정책을 도입한다.", "공정성 평가를 개발한다."], "a": 2, "e": "의사결정 '근거를 설명'하지 못하는 것이 핵심 문제이므로 설명가능성(Explainable AI)이 정답."}, {"q": "기업이 운영과 고객 상호작용 강화를 위해 LLM 도입을 검토 중입니다. LLM의 주요 특징은?", "o": ["깊고 단일한 도메인 전문성이 필요한 고도로 특정한 기술 작업에 탁월하다.", "작은 데이터셋에서 효과적으로 학습·일반화한다.", "추가 프롬프팅 없이 강한 논리·문제해결 능력을 내재한다.", "방대한 데이터로 학습되어 폭넓은 언어·맥락 이해와 다양한 작업 적응력을 가진다."], "a": 3, "e": "LLM은 대규모 데이터로 사전학습되어 범용성·적응력이 특징입니다."}, {"q": "AI 로봇이 도시 내 최적 배송 경로를 학습합니다. 빠르고 성공적인 배송엔 양(+)의 점수, 지연·실패엔 음(-)의 점수를 받아 시간이 지나며 개선됩니다. 어떤 머신러닝 유형인가요?", "o": ["지도학습 (Supervised)", "딥러닝 (Deep learning)", "비지도학습 (Unsupervised)", "강화학습 (Reinforcement)"], "a": 3, "e": "보상/벌점(점수) 피드백으로 시행착오를 통해 개선 → 강화학습."}, {"q": "기업이 여러 부서의 복잡한 워크플로우 자동화와 의사결정 개선을 위해 AI 에이전트 도입을 고려합니다. 생성형 AI 시스템에서 AI 에이전트의 주요 기능은?", "o": ["고급 AI 모델 학습·실행을 위한 컴퓨팅 파워 제공", "AI 모델과 상호작용하는 사용자 인터페이스", "분석·도구 사용·의사결정을 통해 목표를 달성하는 스마트 시스템", "AI 모델이 쓰는 데이터의 중앙 저장소"], "a": 2, "e": "에이전트는 추론하고 도구를 사용하며 스스로 행동을 결정해 목표를 달성합니다."}, {"q": "광고대행사가 전통적 촬영의 느림·비용 문제로, 텍스트에서 사실적인 이미지를 빠르게 다량 생성하려 합니다. 어떤 Google 파운데이션 모델을 써야 할까요?", "o": ["Gemini", "Gemma", "Veo", "Imagen"], "a": 3, "e": "텍스트→이미지 생성은 Imagen. Veo는 동영상, Gemini는 멀티모달 텍스트, Gemma는 경량 오픈모델."}, {"q": "기업이 단일 기술 공급자 종속(lock-in)을 우려하며, 필요에 따라 다양한 AI 도구·플랫폼을 선택·통합하는 능력을 중시합니다. 이를 해결하는 Google Cloud의 고유 특성은?", "o": ["AI 제공에 있어 개방형(open) 접근 방식 강조", "긴밀히 통합된 독점(proprietary) AI 솔루션", "완전관리형 AI 서비스로 사용자 경험 단순화 전략", "AI 워크플로우 자동화에 대한 주력"], "a": 0, "e": "종속을 피하고 선택·통합 자유를 원하면 '개방성(openness)'이 핵심."}, {"q": "컨설팅 리서치팀이 여러 장문의 보고서를 분석해 핵심 트렌드를 찾고 출처 간 정보를 연결해야 합니다. 각 문서의 핵심을 빠르게 이해하고 통찰을 정리하려면 어떤 Google Cloud 제품이 적합할까요?", "o": ["NotebookLM", "Gemini 앱", "Gemini Enterprise Agent Platform의 Agent Search", "Gemini가 포함된 Google Workspace"], "a": 0, "e": "업로드한 다수 문서를 근거로 요약·연결·출처 인용을 해주는 도구는 NotebookLM."}, {"q": "식료품 체인이 판매·재고·마케팅 등 여러 내부 에 한정됨.", "단일 작업에 특화됨.", "광범위한 작업에 대한 적응력.", "작고 특정한 데이터셋으로 학습됨."], "a": 2, "e": "핵심 특징은 다양한 작업에 두루 적용 가능한 적응력(범용성)입니다."}, {"q": "[파운데이션] 다음 중 파운데이션 모델을 정의하는 것은?", "o": ["특정 작업 수행을 위해 좁은 데이터셋으로 학습된 작고 특화된 AI 모델.", "AI 모델 학습·배포에 쓰이는 하드웨어 인프라.", "방대한 양의 데이터로 학습되어 다양한 작업에 적응할 수 있는 대형 AI 모델.", "명시적으로 정의된 규칙에 의존하는 전통적 머신러닝 알고리즘."], "a": 2, "e": "파운데이션 모델은 대규모 데이터로 학습되어 다양한 작업에 적응하는 대형 모델입니다."}, {"q": "[Quiz 3] AI 기반 대출 심사 시스템을 개발 중입니다. 시스템이 책임감 있게 개발되도록 보장하기 위해 취해야 할 조치는 무엇입니까? 2개를 선택하세요.", "o": ["의사결정 과정을 이해하기 어렵더라도 예측 정확도가 매우 높은 복잡한 '블랙박스' 모델을 사용한다.", "시간이 지남에 따라 발생할 수 있는 편향을 식별하고 완화하기 위해 모델의 성능을 정기적으로 감사한다.", "다양한 인구통계 및 사회경제적 배경을 대표할 수 있도록 다양한 지원자가 포함된 데이터셋으로 모델을 학습시킨다.", "공정하고 편향되지 않은 결정을 내릴 수 있는 능력을 신뢰하여 인간의 감독 없이 모델을 배포한다.", "공정성과 투명성보다 속도와 효율성을 우선시한다. 비즈니스 성공에 더 중요한 요소이기 때문이다."], "a": [1, 2], "multi": true, "e": "책임감 있는 AI를 위해서는 모델 편향에 대한 정기적인 감사와 대표성 있는 다양한 데이터셋을 통한 학습이 필수적입니다."}, {"q": "[Quiz 3] '모델 학습(model training)' 단계를 보호(securing)하는 데 있어 핵심적인 측면은 무엇입니까?", "o": ["더 빠른 처리를 위해 모델을 최적화한다.", "무단 액세스로부터 학습 데이터와 모델 파라미터를 보호한다.", "사용되는 학습 데이터의 양을 최소화한다.", "모델의 출력이 시각적으로 매력적인지 확인한다."], "a": 1, "e": "학습 단계를 보호하는 것은 주로 무단 접근으로부터 데이터와 파라미터(가중치 등)를 안전하게 지키는 것을 의미합니다."}, {"q": "[Quiz 3] 안전한 AI 프레임워크(SAIF, Secure AI Framework)의 주요 목표는 무엇입니까?", "o": ["잠재적인 보안 위험에 대한 우려로 인해 AI 개발 및 배포를 제한한다.", "AI 환경의 고유한 과제와 위협을 해결하며, 책임감 있게 AI를 구축하고 배포하기 위한 보안 표준을 확립한다.", "오로지 AI 시스템에 대한 외부 공격을 방지하는 데만 집중한다.", "보안 위험을 고려하지 않고 혁신을 촉진하고 AI 개발을 가속화한다."], "a": 1, "e": "SAIF는 책임감 있는 AI 구축과 배포를 위해 고안된 강력하고 특화된 보안 표준을 확립하는 것을 목표로 합니다."}, {"q": "[Quiz 3] AI 학습에 부정확하거나 불완전한 데이터를 사용할 경우 발생할 수 있는 잠재적인 결과는 무엇입니까?", "o": ["파인튜닝 및 추가 모델 학습의 필요성이 사라진다.", "편향된 결과와 불공정한 결과를 초래한다.", "데이터 스토리지 비효율성을 초래한다.", "비효율적인 사용자 인터페이스를 초래한다."], "a": 1, "e": "부정확하고 불완전한 데이터는 모델이 편향을 학습하게 만들어 불공정한 결과를 내는 원인이 됩니다."}, {"q": "[Quiz 3] 윤리적 AI 개발의 주요 목표는 무엇입니까?", "o": ["모든 법률 및 규제 요구 사항을 준수한다.", "사회적 영향과 관계없이 AI 기능을 극대화한다.", "AI 시스템의 투명성과 책임성을 촉진한다.", "AI 시스템이 책임감 있게 사용되며 피해를 입히지 않도록 보장한다."], "a": 3, "e": "투명성도 중요하지만, 윤리적 AI의 궁극적인 목표는 시스템이 책임감 있게 쓰이고 사람들에게 해를 끼치지 않도록 하는 것입니다."}, {"q": "[Quiz 2] 인간의 언어를 이해하고 생성하도록 특별히 설계된 파운데이션 모델 유형은 무엇입니까?", "o": ["대형 언어 모델 (LLM)", "멀티모달 모델 (Multimodal model)", "디퓨전 모델 (Diffusion model)", "예측 모델 (Predictive model)"], "a": 0, "e": "LLM은 텍스트/인간 언어를 이해하고 생성하도록 구축된 모델입니다."}, {"q": "[Quiz 2] 파운데이션 모델 성능의 한계를 극복하기 위해 사용할 수 있는 기술은 무엇입니까?", "o": ["고급 알고리즘 및 데이터 구조.", "그라운딩(Grounding), 프롬프트 엔지니어링, 파인튜닝, 휴먼인더루프(HITL).", "향상된 처리 능력และ 더 빠른 하드웨어.", "외부 지식 소스에 대한 AI 모델의 접근을 제한하여 환각(hallucination) 방지."], "a": 1, "e": "그라운딩, 프롬프트 엔지니어링, 파인튜닝, 인간의 검토(HITL)는 파운데이션 모델의 한계를 보완하고 정확도를 높이는 주요 기법입니다."}, {"q": "[Quiz 2] 텍스트 설명에서 사실적인 이미지를 생성하는 데 가장 적합한 파운데이션 모델 유형은 무엇입니까?", "o": ["분류 모델 (Classification model)", "디퓨전 모델 (Diffusion model)", "멀티모달 모델 (Multimodal model)", "대형 언어 모델 (LLM)"], "a": 1, "e": "디퓨전 모델(예: Imagen)은 텍스트에서 이미지를 생성하는 표준 파운데이션 모델입니다."}, {"q": "[Quiz 2] 머신러닝에서 휴먼인더루프(HITL, Humans in the loop)의 주된 역할은 무엇입니까?", "o": ["모든 의사결정 과정을 자동화한다.", "특히 판단이나 문맥이 필요한 작업에서 인간의 전문 지식을 ML 과정에 통합한다.", "데이터 수집 및 모델 학습의 필요성을 제거한다.", "AI 알고리즘을 완전히 대체한다."], "a": 1, "e": "HITL은 AI가 놓칠 수 있는 미묘한 뉘앙스나 중요한 판단이 필요한 영역에 인간의 통찰력을 결합하는 역할을 합니다."}, {"q": "[Quiz 2] 생성형 AI에서 그라운딩(grounding)의 주된 목적은 무엇입니까?", "o": ["AI 애플리케이션 배포 비용을 절감한다.", "AI의 출력을 검증 가능한 정보 출처와 연결한다.", "AI 모델 학습의 속도와 효율성을 높인다.", "AI의 창의적인 콘텐츠 생성 능력을 향상시킨다."], "a": 1, "e": "그라운딩은 환각(할루시네이션)을 방지하기 위해 AI의 답변을 검증 가능한 외부 문서나 사실 기반에 연결하는 과정입니다."}, {"q": "[Quiz 2] 모델을 선택할 때 파인튜닝 및 맞춤화가 중요한 요소인 이유는 무엇입니까?", "o": ["모델이 항상 사용 가능하도록 보장한다.", "모델의 컨텍스트 창(context window)을 늘려준다.", "모델 사용 비용을 줄여준다.", "특정 작업이나 도메인에 맞게 모델을 조정할 수 있게 해준다."], "a": 3, "e": "파인튜닝은 범용 모델을 특정 산업 도메인이나 조직의 특정 작업에 맞게 전문화할 수 있도록 해줍니다."}, {"q": "[Quiz 1] 강화학습(Reinforcement learning)에서 에이전트가 학습하는 주된 방법은 무엇입니까?", "o": ["라벨이 지정된 예제의 대규모 데이터셋을 분석하여 학습한다.", "환경과 상호작용하고 피드백을 받으면서 학습한다.", "올바른 행동에 대해 명시적으로 프로그래밍되어 학습한다.", "전문가의 시연을 관찰하고 모방하여 학습한다."], "a": 1, "e": "강화학습은 에이전트가 환경과 상호작용하며 그에 따른 보상이나 패널티(피드백)를 통해 시행착오를 거치며 학습하는 방식입니다."}, {"q": "[Quiz 1] 올바른 ML 수명주기(lifecycle) 단계를 순서대로 나열한 것은?", "o": ["모델 학습 > 데이터 수집 및 준비 > 모델 배포 > 모델 관리", "모델 학습 > 모델 배포 > 모델 관리 > 데이터 수집 및 준비", "데이터 수집 및 준비 > 모델 학습 > 모델 배포 > 모델 관리", "데이터 수집 및 준비 > 모델 학습 > 모델 관리 > 모델 배포"], "a": 2, "e": "데이터를 준비(Ingestion)한 뒤, 모델을 학습(Training)시키고, 배포(Deployment)한 후, 마지막으로 모니터링/관리(Management)하는 것이 올바른 순서입니다."}, {"q": "[Quiz 1] 다음 중 비정형(unstructured) 데이터의 예는 무엇입니까?", "o": ["고객 이름, 주소, 구매 내역이 포함된 스프레드시트.", "직원 이름, 급여, 직함이 포함된 테이블.", "자유 형식의 텍스트 단락으로 된 고객 리뷰 모음.", "제품 ID, 가격, 재고 수준이 포함된 데이터베이스."], "a": 2, "e": "자유 형식의 텍스트는 미리 정의된 데이터 모델이나 구조가 없으므로 비정형 데이터에 해당합니다."}, {"q": "[Quiz 1] ML 워크플로우에서 데이터 수집 및 준비(ingestion and preparation) 단계의 주된 목적은 무엇입니까?", "o": ["원시 데이터를 수집, 정제 및 변환한다.", "머신러닝 모델을 학습시킨다.", "모델 성능을 모니터링한다.", "학습된 모델을 배포한다."], "a": 0, "e": "데이터 수집 및 준비 단계는 모델을 학습시키기 전에 데이터를 모으고, 노이즈를 제거하며, 적절한 형식으로 변환하는 것에 집중합니다."}, {"q": "[Quiz 1] 일관성(consistency)이 AI 모델 학습에 미치는 영향은 무엇입니까?", "o": ["데이터 검색 속도를 높여준다.", "데이터가 작업과 관련성이 있도록 보장한다.", "데이터 스토리지 필요성을 줄여준다.", "일관되지 않은 형식과 라벨링은 모델을 혼란스럽게 하고 학습을 방해할 수 있다."], "a": 3, "e": "데이터 형식과 라벨링에 일관성이 없으면 알고리즘이 올바른 패턴을 찾지 못하고 혼란을 겪어 모델 성능이 저하됩니다."}, {"q": "[Quiz 1] 머신러닝의 맥락에서 '모델(model)'이란 무엇입니까?", "o": ["데이터의 시각적 표현.", "일종의 컴퓨터 하드웨어.", "의사결정을 위해 사전 정의된 규칙 집합.", "입력을 처리하여 출력을 생성하는 복잡한 수학적 구조."], "a": 3, "e": "ML 모델은 알고리즘이 데이터의 패턴을 학습하여 입력을 기반으로 예측(출력)을 수행하도록 만들어진 수학적 함수이자 구조입니다."}, {"q": "생성형 AI 솔루션을 구현할 때 긍정적 영향을 계획하기 위한 주요 단계는 무엇입니까?", "o": ["기수 채택에 집중하고 긍정적인 영향이 뒤따를 것이라고 가정한다.", "윤리적 영향을 고려하지 않고 AI 기능을 우선시한다.", "초기에는 단기적인 목표에 집중하여 데이터를 수집하고 분석한다.", "주요 지표를 정의하고, 데이터를 수집 및 분석하며, 반복하고 개선한다."], "a": 3, "e": "목표 지표를 정의하고 데이터를 수집, 반복 및 개선하는 것이 권장되는 계획 단계입니다."}, {"q": "Vertex AI Search의 핵심 기능 중 생성형 AI의 환각(hallucination) 문제를 완화하고 검색 결과가 신뢰할 수 있는 정보에 기반하도록 보장하는 기능은 무엇입니까?", "o": ["세분화된 액세스 제어 (Granular access controls)", "그라운딩 (Grounding)", "고급 분석 (Advanced analytics)", "멀티모달 검색 (Multimodal search)"], "a": 1, "e": "그라운딩은 출력을 구체적이고 검증 가능한 신뢰할 수 있는 정보 출처에 연결합니다."}, {"q": "다음 중 AI 에이전트의 핵심 구성 요소를 가장 잘 식별하는 것은 무엇입니까?", "o": ["API 연결, 클라우드 기능, 정교한 데이터베이스.", "복잡한 알고리즘, 사용자 인터페이스, 데이터 저장 시스템.", "추론 루프(reasoning loop), 도구(tools), 파운데이션 모델.", "자세한 사용자 매뉴얼, 고객 서비스 챗봇, 고급 마케팅 기술."], "a": 2, "e": "AI 에이전트의 주요 구성 요소는 파운데이션 모델, 외부 작업을 수행하는 도구, 의사 결정을 위한 추론 루프입니다."}, {"q": "조직 내에서 Gemini Enterprise의 주된 목적은 무엇입니까?", "o": ["AI 기반 챗봇과 상호작용하기 위한 고객용 인터페이스를 제공한다.", "회사 데이터를 활용하여 직원을 지원할 수 있는 AI 에이전트를 구성하고 접근하기 위한 중앙 플랫폼을 제공한다.", "데이터 유출을 탐지하고 방지하여 조직의 사이버 보안 방어를 강화한다.", "모든 회사 데이터를 저장하고 관리하기 위한 중앙 리포지토리를 생성한다."], "a": 1, "e": "Gemini Enterprise는 기업 데이터를 바탕으로 내부 직원을 돕는 맞춤형 AI 에이전트를 구축 및 관리할 수 있게 해줍니다."}, {"q": "Google Cloud의 Customer Engagement Suite로 대화형 에이전트를 구축할 때 하이브리드 접근 방식(결정론적 AI와 생성형 AI 결합)을 사용하는 주요 이점은 무엇입니까?", "o": ["에이전트가 간단하고 예측 가능한 고객 문의만 처리할 수 있게 해준다.", "생성형 AI의 유연성을 활용하면서도 에이전트의 행동을 엄격하게 제어할 수 있게 해준다.", "고객 상호작용에서 인간 상담원의 필요성을 없애준다.", "일관성을 보장하기 위해 에이전트 응답을 사전 정의된 스크립트로 제한한다."], "a": 1, "e": "하이브리드 접근 방식은 생성형 AI의 유연성을 누리면서도 동시에 규칙 기반(결정론적)으로 엄격한 통제가 가능하다는 이점이 있습니다."}, {"q": "제공된 정보에 따르면 검색 증강 생성(RAG) 워크플로우에서 대형 언어 모델(LLM)은 데이터 저장소(data stores)와 어떻게 상호작용합니까?", "o": ["LLM은 데이터 저장소에서 수동적으로 정보를 수신하며 업데이트가 푸시되기를 기다린다.", "LLM은 데이터 저장소를 사용하여 기본 지식과 매개변수를 영구적으로 확장한다.", "LLM은 사용자의 요청과 관련된 정보를 검색하기 위해 데이터 저장소에 질의(query)하고, 이를 통해 응답을 풍부하게 만든다.", "LLM은 응답 생성에 전적으로 데이터 저장소에만 의존하며 내부 지식은 무시한다."], "a": 2, "e": "RAG 환경에서 LLM은 능동적으로 외부 데이터 저장소에 질의하여 관련 문맥을 불러온 뒤 답변을 생성합니다."}, {"q": "다음 중 생성형 AI 에이전트 내에서 '추론 루프(reasoning loop)'의 기능을 가장 잘 설명하는 것은 무엇입니까?", "o": ["에이전트가 대화형 방식으로 사용자와 상호작용하고 프롬프트와 질문에 응답할 수 있게 한다.", "에이전트가 편차 없이 따를 수 있는 일회성 지침 세트를 설정한다.", "에이전트가 작업을 해결하기 위해 관찰, 내부 추론 및 의사 결정의 반복적인 과정을 거치도록 안내한다.", "예측 가능한 행동을 보장하기 위해 에이전트의 행동을 사전 정의된 응답 세트로 제한한다."], "a": 2, "e": "추론 루프는 에이전트가 상황을 관찰하고, 생각(추론)하고, 결정을 내려 행동하는 반복적 과정입니다."}, {"q": "팀 회의 일정을 잡는 임무를 맡은 AI 에이전트가 있다고 상상해 보십시오. 에이전트는 팀원들의 캘린더에 접근하고, 적절한 시간대를 제안하며, 초대장을 보내야 합니다. 이 작업에 가장 필수적인 에이전트 도구의 조합은 무엇입니까?", "o": ["데이터 저장소(Data stores)와 함수(functions).", "플러그인(Plugins)과 데이터 저장소(data stores).", "함수(Functions)와 데이터베이스(databases).", "확장 프로그램(Extensions)과 플러그인(plugins)."], "a": 3, "e": "캘린더에서 일정을 확인하거나 초대장을 보내는 외부 시스템 연동에는 주로 Extensions(확장) 및 Plugin(플러그인)과 같은 API 도구가 사용됩니다."}, {"q": "다음 중 생성형 AI의 맥락에서 멀티 에이전트 시스템(multi-agent system)의 개념을 가장 잘 보여주는 시나리오는 무엇입니까?", "o": ["데이터베이스, 웹 검색 API 등 여러 도구를 사용하여 작업을 완료하는 단일 AI 에이전트.", "다양한 작업에 적응하기 위해 다양한 매개변수로 맞춤화할 수 있는 AI 에이전트.", "예를 들어 여행 예약과 같은 복잡한 목표를 달성하기 위해 여러 전문 AI 에이전트가 협업하는 시스템.", "이메일 작성 및 문서 요약과 같은 여러 작업을 수행할 수 있는 단일 AI 에이전트."], "a": 2, "e": "멀티 에이전트 시스템은 전체 목표 달성을 위해 각기 다른 역할을 맡은 여러 특화 에이전트들이 협업하는 구조입니다."}, {"q": "Google AI Studio에서 Gemini 출력의 무작위성(randomness)과 창의성을 제어하기 위해 조정해야 하는 매개변수는 무엇입니까?", "o": ["토큰 수 (Token count)", "안전 설정 (Safety settings)", "출력 길이 (Output length)", "Temperature"], "a": 3, "e": "Temperature 값을 조정하면 모델이 답변을 생성할 때 무작위성과 창의성 정도를 제어할 수 있습니다."}, {"q": "타깃 사용자와 관련하여 Google AI Studio와 Vertex AI Studio의 주된 차이점은 무엇입니까?", "o": ["Google AI Studio는 맞춤형 모델 구축을 위한 것이고, Vertex AI Studio는 사전 학습된 모델 사용을 위한 것이다.", "Google AI Studio는 코딩 경험이 필요한 반면, Vertex AI Studio는 모델과 상호작용하기 위한 노코드(no-code) 인터페이스를 제공한다.", "Google AI Studio는 초보자와 실험용으로 설계된 반면, Vertex AI Studio는 전문가와 대규모 프로젝트를 대상으로 한다.", "Google AI Studio는 이미지 생성 모델 액세스를 위한 것이고, Vertex AI Studio는 텍스트 기반 모델을 위한 것이다."], "a": 2, "e": "Google AI Studio는 프로토타이핑과 실험에 적합하고, Vertex AI Studio는 엔터프라이즈 수준의 본격적인 프로젝트에 적합합니다."}, {"q": "Gemini for Google Cloud의 엔터프라이즈 보안 모델에 대한 설명 중 옳은 것은 무엇입니까?", "o": ["Google이 고객 데이터에 대한 액세스 및 권한을 통제한다.", "고객 데이터는 공개적으로 접근 가능한 데이터셋에 포함된다.", "고객 데이터는 타사 개발자와 공유된다.", "고객 데이터는 암호화되며 액세스 제어가 적용된다."], "a": 3, "e": "엔터프라이즈 환경에서는 고객의 데이터가 공개 모델 학습에 사용되거나 공유되지 않으며, 암호화되고 엄격히 제어됩니다."}, {"q": "개발팀이 코딩 효율성과 협업을 향상시키려 합니다. 그들에게 가장 유익한 Gemini for Google Cloud 도구는 무엇입니까?", "o": ["Gemini in Security Command Center", "Gemini in Databases", "Gemini Code Assist", "Gemini Cloud Assist"], "a": 2, "e": "Gemini Code Assist는 개발자의 코드 작성, 리뷰, 수정 및 협업을 돕기 위해 특별히 제작된 도구입니다."}, {"q": "문서에서 프롬프트를 복사하여 붙여넣는 방식으로 재사용하는 것과 비교할 때, Gemini의 저장된 정보(Saved info) 기능을 사용하는 것의 주요 이점은 무엇입니까?", "o": ["저장된 정보(Saved info)는 당신의 직무나 회사 세부 정보와 같은 특정 정보가 모든 Gemini 대화에 일관되게 적용되도록 보장한다.", "저장된 정보는 모든 동료와 자동으로 공유되어 협업을 촉진한다.", "저장된 정보는 Gemini 비밀번호를 저장하는 곳이다.", "저장된 정보를 통해 굵은 글씨체나 글머리 기호 같은 더 풍부한 서식을 프롬프트에 저장할 수 있다."], "a": 0, "e": "'Saved info(저장된 정보)'는 사용자의 배경 맥락을 영구적으로 저장하여 일일이 다시 입력할 필요 없이 일관되게 적용해줍니다."}, {"q": "그라운딩(grounding)은 Gemini에서 Gem의 신뢰성을 어떻게 향상시킵니까?", "o": ["Gem이 사용자 상호작용에서 학습하여 시간이 지남에 따라 응답을 개선할 수 있게 한다.", "Gem이 인터넷의 어떤 웹사이트 정보든 접근하고 처리할 수 있게 한다.", "Gem의 출력을 구체적이고 검증 가능한 정보 출처와 연결한다.", "Gem이 부정확한 응답을 생성하는 것을 완전히 방지한다."], "a": 2, "e": "그라운딩은 출력을 사실 기반의 검증 가능한 출처와 연결하여 허위 사실 생성을 억제합니다."}, {"q": "당신은 신제품 출시에 대해 논의할 회의를 준비 중인 제품 관리자입니다. Google 드라이브에는 시장 조사 보고서, 경쟁사 분석 및 고객 피드백 설문조사가 저장되어 있습니다. NotebookLM이 이 회의 준비를 어떻게 도울 수 있습니까?", "o": ["NotebookLM은 문서에서 주요 결과를 요약하고, 잠재적 과제를 식별하며, 논의할 핵심 주제를 제공하여 생산적인 회의를 이끌도록 도울 수 있다.", "NotebookLM은 팀원들의 성격에 기반하여 그들이 할 질문을 예측하고 답변을 미리 준비할 수 있다.", "NotebookLM은 추천 의제와 함께 모든 회의 참석자에게 캘린더 초대장을 자동으로 보낼 수 있다.", "NotebookLM은 회의용 슬라이드와 스크립트가 포함된 프레젠테이션을 자동으로 생성할 수 있다."], "a": 0, "e": "NotebookLM은 업로드된 여러 소스 문서를 기반으로 핵심 인사이트를 연결하고 요약하는데 최적화되어 있습니다."}, {"q": "AI 모델에서 RAG(Retrieval-Augmented Generation, 검색 증강 생성)의 주요 기능은 무엇입니까?", "o": ["방대한 양의 정보를 암기하는 AI 모델의 능력을 향상시킨다.", "AI 모델의 출력을 사전 정의된 응답 세트로 제한한다.", "AI 모델이 출력을 생성할 때 외부 지식 소스에 접근하고 활용할 수 있게 한다.", "AI 모델의 출력 생성 과정에서 인간의 개입을 대체한다."], "a": 2, "e": "RAG는 모델이 응답을 생성하기 전 외부 문서나 데이터 저장소에서 관련 정보를 '검색(Retrieval)'해 오도록 하는 기능입니다."}, {"q": "팀 프로젝트에 NotebookLM Enterprise를 사용할 때의 주요 이점은 무엇입니까?", "o": ["NotebookLM Enterprise는 NotebookLM 개인용 제품과 동일하다.", "Google이 NotebookLM Enterprise의 데이터를 통제한다.", "NotebookLM Enterprise에서는 사전 정의된 Identity and Access Management(IAM) 역할을 사용하여 노트북 접근을 관리할 수 있다.", "Google이 NotebookLM Enterprise의 모든 데이터에 접근할 수 있다."], "a": 2, "e": "엔터프라이즈 버전은 회사의 기존 IAM 정책과 통합되어 안전한 접근 및 권한 관리를 제공합니다."}, {"q": "당신은 블로그 글, SNS 캡션, 웹사이트 문구 등 다양한 유형의 콘텐츠를 제작하는 프리랜서 작가입니다. 프로젝트에 따라 다양한 글쓰기 스타일과 어조 사이를 자주 전환해야 합니다. 작업 흐름을 간소화하고 다양한 형식에 걸쳐 일관된 글쓰기를 보장하려고 합니다. 요구 사항에 가장 적합한 Gemini의 기능은 무엇입니까?", "o": ["Gems", "Gemini for Google Cloud", "Gemini Saved info", "Gemini Deep Research"], "a": 0, "e": "Gems를 활용하면 특정한 역할, 글쓰기 스타일, 어조를 고정해둔 맞춤형 인공지능을 여러 개 만들 수 있습니다."}, {"q": "당신은 다양한 시간대에 위치한 동료들과 Google Meet로 화상 회의를 이끌고 있습니다. 일부 참석자들은 언어 장벽 때문에 논의를 이해하는 데 어려움을 겪고 있습니다. Gemini가 이 Google Meet 화상 회의를 어떻게 지원할 수 있습니까?", "o": ["Gemini는 회의 채팅에 음성 대화의 번역된 요약을 제공할 수 있다.", "Gemini는 화자 식별 기능이 포함된 실시간 번역 자막을 생성하여, 언어나 억양 차이에 관계없이 모두가 쉽게 따라갈 수 있게 해준다.", "Gemini는 모두가 동일하게 잘 들을 수 있도록 각 화자의 볼륨을 자동으로 조절할 수 있다.", "Gemini는 회의에 참석하지 못한 사람들을 위해 논의 내용을 자동으로 요약할 수 있다."], "a": 1, "e": "실시간 번역 자막 기능은 언어 장벽이 있는 글로벌 회의에서 참석자의 접근성과 이해도를 크게 높여줍니다."}, {"q": "프롬프트에 예시를 전혀 제공하지 않고 파운데이션 모델의 기존 지식에만 전적으로 의존하는 프롬프팅 기법은 무엇입니까?", "o": ["멀티 샷 프롬프팅 (Multi-shot prompting)", "제로 샷 프롬프팅 (Zero-shot prompting)", "퓨 샷 프롬프팅 (Few-shot prompting)", "원 샷 프롬프팅 (One-shot prompting)"], "a": 1, "e": "예시를 제공하지 않고 작업을 지시하는 것을 제로 샷(Zero-shot) 프롬프팅이라고 합니다."}, {"q": "역할(Role) 프롬프팅을 사용할 때의 주된 이점은 무엇입니까?", "o": ["AI 모델이 몇 가지 예시를 통해 학습할 수 있게 해준다.", "출장 일정 계획과 같은 복잡한 작업을 가능하게 한다.", "AI에 특정 페르소나를 부여하여 응답의 스타일, 어조 및 초점에 영향을 준다.", "복잡한 질문을 이해하는 AI 모델의 능력을 향상시킨다."], "a": 2, "e": "역할 프롬프팅은 AI에게 구체적인 페르소나를 할당해 답변의 톤앤매너와 관점을 원하는 방향으로 조정하는 데 유리합니다."}, {"q": "언어 학습 앱을 설계 중이며 대화 연습을 하는 학생들에게 개인화된 피드백을 제공할 수 있는 AI 튜터를 통합하고자 합니다. AI와 학생의 상호작용을 안내하는 데 가장 효과적인 역할 프롬프트는 무엇입니까?", "o": ["\"당신은 언어 학습 연습에 대해 건설적인 피드백을 제공하는 유용하고 격려하는 튜터입니다.\"", "\"대화 기술을 연습하는 학생들에게 개인화된 피드백을 제공하시오.\"", "\"당신은 학생들이 새로운 언어를 배우는 것을 돕기 위해 만들어진 언어 모델입니다.\"", "\"당신은 언어 능력을 평가하도록 프로그래밍된 로봇입니다.\""], "a": 0, "e": "페르소나의 톤(유용하고 격려하는)과 구체적인 역할(건설적인 피드백 제공)이 가장 잘 명시되어 있습니다."}, {"q": "당신은 신규 고객을 위한 제안서를 작성 중이며, 글이 명확하고 간결하며 설득력 있도록 보장하고 싶습니다. Google 문서(Docs)의 Gemini가 이 작업에 어떻게 도움을 줄 수 있습니까?", "o": ["Docs의 Gemini는 고객 프로젝트에서의 역할에 따라 팀원들에게 자동으로 작업을 할당할 수 있다.", "Docs의 Gemini는 과거 상호작용을 기반으로 제안서에 대한 고객의 반응을 예측할 수 있다.", "Docs의 Gemini는 글쓰기 스타일, 문법, 어조를 개선하기 위한 제안을 제공하고, 메시지 전달력을 높이기 위한 다양한 표현 옵션을 생성할 수 있다.", "Docs의 Gemini는 제안서 내용을 분석하고 그 효과를 높이기 위한 차트 및 그래프 같은 관련 시각 자료를 자동으로 생성할 수 있다."], "a": 2, "e": "Google 문서의 Gemini는 어조 변경, 문법 수정 및 다양한 문구 옵션을 제안하는 강력한 편집기 역할을 합니다."}, {"q": "AI 애플리케이션을 위한 엣지 컴퓨팅(edge computing)의 주된 장점은 무엇입니까?", "o": ["데이터 저장 용량 증가", "개발 비용 감소", "데이터 전처리 필요성 감소", "실시간 응답성 및 지연 시간(latency) 감소"], "a": 3, "e": "엣지 디바이스 내에서 데이터를 처리하면 원격 서버로 데이터를 보낼 필요가 없어 지연 시간(latency)이 크게 단축됩니다."}, {"q": "마케팅팀이 다가오는 이커머스 세일을 위해 매력적인 제품 설명글을 빠르게 생성해야 합니다. 이를 달성하는 데 가장 효율적인 접근 방식은 무엇입니까?", "o": ["기존 제품 데이터를 사용하여 Model Garden에서 사전 학습된 언어 모델을 파인튜닝한다.", "카피라이터 팀을 고용하여 각 설명을 수동으로 작성한다.", "설명글의 초안을 작성하기 위해 Gemini가 포함된 Google Workspace와 같은 생성형 AI 기반 애플리케이션을 사용한다.", "제품 설명 생성을 위해 처음부터 맞춤형 모델을 구축한다."], "a": 2, "e": "이와 같은 일상적이고 신속한 초안 작성 작업에는 사전 구축된 애플리케이션(예: Workspace)이 가장 빠르고 효율적입니다."}, {"q": "맞춤형 AI 에이전트를 구축 및 배포하고 AI 기능을 애플리케이션에 통합하는 책임을 지는 역할은 누구입니까?", "o": ["비즈니스 리더 (Business leaders)", "네트워크 엔지니어 (Network engineers)", "개발자 (Developers)", "AI 실무자 (AI practitioners)"], "a": 2, "e": "애플리케이션 계층에 AI 기능을 연동하고 시스템을 개발, 배포하는 역할은 주로 개발자(Developers)가 수행합니다."}, {"q": "Gemini Nano는 무엇을 위해 설계되었습니까?", "o": ["엣지 디바이스 및 스마트폰에 AI 배포", "슈퍼컴퓨터에서 복잡한 시뮬레이션 실행", "데이터 센터에서 대형 언어 모델 학습", "AI 인프라 관리 및 모니터링"], "a": 0, "e": "Nano 모델은 모바일 기기와 엣지 디바이스에서 온디바이스로 작동하도록 최적화된 경량 모델입니다."}, {"q": "AI 인프라의 맥락에서 GPU와 TPU는 무엇입니까?", "o": ["AI 작업에서 병렬 처리를 위해 설계된 특수 프로세서(하드웨어).", "AI 모델 관리를 위한 소프트웨어 애플리케이션.", "대규모 AI 데이터셋을 저장하기 위한 저장 장치.", "AI 시스템을 연결하기 위한 네트워킹 프로토콜."], "a": 0, "e": "GPU(그래픽 처리 장치)와 TPU(텐서 처리 장치)는 AI 연산에 필요한 대규모 병렬 처리에 특화된 프로세서입니다."}, {"q": "생성형 AI에서 고성능 스토리지(storage)가 중요한 이유는 무엇입니까?", "o": ["AI 시스템의 책임감 있는 사용을 보장하기 위해.", "AI 모델과 상호작용하기 위한 사용자 친화적인 인터페이스를 제공하기 위해.", "AI 모델의 배포 및 관리를 자동화하기 위해.", "AI 학습에 사용되는 방대한 데이터셋을 저장하고 효율적으로 접근하기 위해."], "a": 3, "e": "모델 학습을 위해서는 방대한 양의 데이터를 빠르게 읽고 써야 하므로 높은 I/O 성능을 갖춘 스토리지가 병목 방지에 필수적입니다."}, {"q": "Vertex AI에서 AutoML의 목적은 무엇입니까?", "o": ["데이터 준비부터 배포까지 전체 ML 워크플로우를 자동화한다.", "다양한 사용 사례를 위해 사전 학습된 모델을 제공한다.", "배포된 AI 모델의 성능을 관리하고 모니터링한다.", "사용자가 최소한의 기술적 전문 지식만으로도 AI 모델을 구축하고 학습시킬 수 있게 해준다."], "a": 3, "e": "AutoML은 모델의 복잡한 튜닝과 학습 과정을 자동화하여, 전문적인 머신러닝 지식이 적어도 모델을 학습시킬 수 있게 해줍니다."}, {"q": "Vertex AI에서 MLOps의 역할은 무엇입니까?", "o": ["입력과 도구를 기반으로 목표를 달성하는 최선의 방법을 학습한다.", "ML 프로젝트 수명주기(lifecycle)를 자동화, 표준화 및 관리한다.", "사용자가 AI 기능과 상호작용할 수 있게 해준다.", "AI 시스템을 위한 물리적 하드웨어를 제공한다."], "a": 1, "e": "MLOps(머신러닝 운영)는 ML 모델의 학습, 배포, 유지관리 과정을 안정적으로 구축하고 표준화하는 프레임워크입니다."}, {"q": "다음 중 Vertex AI의 Model Garden을 가장 잘 설명하는 것은 무엇입니까?", "o": ["기존 AI 모델을 발견, 맞춤화 및 배포하기 위한 서비스.", "처음부터 AI 모델을 개발하고 추가로 실험하기 위한 플랫폼.", "사전 학습된 AI 모델을 찾고 배포하기 위해 설계된 서비스.", "AI 인프라를 관리하고 모니터링하기 위한 플랫폼."], "a": 0, "e": "Model Garden은 Google 모델 및 오픈소스 모델들을 쉽게 탐색하고, 튜닝하며, 배포할 수 있는 카탈로그 서비스입니다."}, {"q": "한 여행사가 고객의 휴가 계획을 돕기 위해 AI 에이전트를 사용하려고 합니다. 이 AI 기반 여행 계획 경험을 만들기 위해 '에이전트(agents)' 계층과 '애플리케이션(applications)' 계층은 어떻게 함께 작동합니까?", "o": ["에이전트 계층이 여행 계획 애플리케이션의 사용자 인터페이스를 제공한다.", "애플리케이션 계층이 AI 에이전트 작동에 필요한 계산 리소스를 제공한다.", "애플리케이션 계층이 항공편 검색이나 호텔 예약과 같이 AI 에이전트가 수행할 특정 작업을 결정한다.", "에이전트 계층이 AI의 기능(검색, 예약, 추천)을 정의하고, 애플리케이션 계층이 사용자가 에이전트와 상호작용할 수 있는 화면(웹사이트나 앱)을 제공한다."], "a": 3, "e": "에이전트는 추론과 도구 호출(논리)을 담당하며, 애플리케이션은 사용자가 해당 기능에 접근할 수 있는 껍데기(UI)를 담당합니다."}, {"q": "게임 개발자가 게임 내에서 더 현실적이고 참여를 유도하는 NPC(비플레이어 캐릭터)를 만들고자 합니다. 이 AI 기반 NPC의 행동과 기능을 정의하는 데 생성형 AI 환경의 어느 계층이 가장 중요합니까?", "o": ["에이전트 (Agents)", "플랫폼 (Platforms)", "인프라 (Infrastructure)", "모델 (Models)"], "a": 0, "e": "NPC가 주변을 관찰하고 동적으로 판단을 내리며 행동하도록 하려면 '에이전트' 계층의 설계가 핵심적입니다."}, {"q": "뉴스 기관이 각 사용자에게 개인화된 뉴스를 전달하는 AI 에이전트를 개발하려고 합니다. 이 개인화된 뉴스 리더 애플리케이션의 기능에서 '에이전트(agents)' 계층은 어떻게 기여합니까?", "o": ["에이전트 계층이 뉴스 데이터를 저장하고 처리하기 위한 인프라를 제공한다.", "에이전트 계층이 뉴스 리더 애플리케이션의 사용자 인터페이스를 디자인한다.", "에이전트 계층이 자연어 처리 및 이해를 위한 기본 AI 모델을 제공한다.", "에이전트 계층이 기사 필터링, 정보 요약, 추천 등의 AI가 수행할 특정 작업을 정의한다."], "a": 3, "e": "목표 달성을 위해 어떤 구체적인 작업(추천, 요약 등)을 스스로 수행할지 결정하는 것이 에이전트 계층의 역할입니다."}, {"q": "AI 에이전트를 독립 실행형 AI 모델(standalone AI models)과 구별하는 두 가지 핵심 요소는 무엇입니까?", "o": ["자동화(Automation)와 개인화(personalization).", "데이터 접근(Data access)과 사용자 인터페이스(user interface).", "자연어 처리(Natural language processing)와 머신러닝(machine learning).", "추론 루프(Reasoning loop)와 도구(tools)."], "a": 3, "e": "단순한 모델과 달리 에이전트는 상황을 스스로 분석하는 '추론 루프'와 외부 시스템을 호출하는 '도구'를 갖추고 있습니다."}, {"q": "화상 처리 등을 담당하는 데이터 과학 팀이 방대한 이미지 데이터셋으로 새로운 생성형 AI 모델을 학습시키고 있습니다. 계산 집약적인 학습 과정을 처리하기 위해 강력한 하드웨어 및 소프트웨어 리소스에 대한 접근이 필요합니다. 생성형 AI 환경의 어느 계층이 이 팀에 필요한 계산 능력과 저장 공간을 제공합니까?", "o": ["플랫폼 (Platforms)", "에이전트 (Agents)", "인프라 (Infrastructure)", "애플리케이션 (Applications)"], "a": 2, "e": "가속기(GPU/TPU)와 대용량 스토리지 같은 물리적인 하드웨어 컴퓨팅 파워는 인프라스트럭처(Infrastructure) 계층에서 제공합니다."}, {"q": "Vertex AI에서 제공하는 옵션 중, 기존 구글이나 타사 오픈소스 모델을 선택하는 것이 아니라, 사용자가 직접 조직의 자체 모델을 학습(train)시키고 활용하고자 할 때 선택해야 하는 기능은 무엇입니까? [cite: 812]", "o": ["Model Garden", "Model Builder", "AutoML", "LiteRT"], "a": 1, "e": "Model Builder는 사용자가 자신만의 모델을 직접 학습시키고 사용할 수 있도록 하는 기능입니다. [cite: 812]"}, {"q": "디바이스(모바일 등) 상에서 직접 실행되도록 특별히 설계된 구글의 가장 효율적이고 콤팩트한 AI 모델은 무엇입니까? [cite: 807]", "o": ["Gemini Pro", "Gemini Nano", "Gemini Advanced", "Gemini Ultra"], "a": 1, "e": "Gemini Nano는 디바이스에서 실행되도록 특별히 설계된 Google의 가장 효율적이고 콤팩트한 AI 모델입니다. [cite: 807]"}, {"q": "사용자가 파일을 업로드하면 해당 소스 자료에 기반(grounding)하여 핵심 포인트를 요약하고, 질문에 답하며, 아이디어를 생성하는 '연구 어시스턴트(research assistant)' 역할을 하는 도구는 무엇입니까? [cite: 845]", "o": ["Google Workspace with Gemini", "Gemini for Google Cloud", "NotebookLM", "Gemini Enterprise"], "a": 2, "e": "NotebookLM은 사용자가 업로드한 파일(소스 자료)에 기반하여 핵심 요약, 질의응답 등을 수행하는 연구 어시스턴트 도구입니다. [cite: 845]"}, {"q": "프롬프팅(Prompting) 기법 중, 모델에게 페르소나(Persona)를 부여하여 응답의 스타일, 어조 및 초점에 영향을 미치게 하는 방법은 무엇입니까? [cite: 825]", "o": ["제로 샷(Zero-shot) 프롬프팅", "퓨 샷(Few-shot) 프롬프팅", "역할(Role) 프롬프팅", "프롬프트 체이닝(Prompt Chaining)"], "a": 2, "e": "역할(Role) 프롬프팅은 모델에게 특정 페르소나를 할당하여 응답의 스타일, 어조, 초점에 영향을 주는 기법입니다. [cite: 825]"}, {"q": "챗봇에 실제 대화와 같은 자연스러운 느낌을 주기 위해 대형 언어 모델(LLM)을 사용하고 자연어로 정의되는 에이전트의 유형은 무엇입니까? [cite: 867]", "o": ["결정론적(Deterministic) 에이전트", "생성형(Generative) 에이전트", "규칙 기반(Rule-based) 에이전트", "오픈소스 에이전트"], "a": 1, "e": "생성형(Generative) 에이전트는 자연어와 LLM을 사용하여 챗봇에 실제 대화와 같은 느낌을 제공합니다. [cite: 867] 반면 결정론적 에이전트는 사전 정의된 경로와 작업으로 구축됩니다. [cite: 866]"}, {"q": "문제 해결 과정을 안내하기 위해 '중간 추론 단계'가 포함된 예시를 제공하여 대형 언어 모델(LLM)을 돕는 프롬프트 엔지니어링 기법은 무엇입니까? [cite: 881]", "o": ["ReAct (Reason and act)", "CoT (Chain-of-thought, 생각의 사슬)", "Metaprompting (메타프롬프팅)", "제로 샷(Zero-shot) 프롬프팅"], "a": 1, "e": "CoT(Chain-of-thought)는 중간 추론 단계가 포함된 예시를 제공하여 LLM이 문제 해결 과정을 거치도록 안내하는 기법입니다. [cite: 881]"}, {"q": "머신러닝(ML) 학습 방식 중, 라벨이 지정되지 않은 데이터(unlabeled data)를 사용하여 데이터 내의 자연스러운 그룹화와 패턴을 찾아내는 방식은 무엇입니까? [cite: 918]", "o": ["지도 학습 (Supervised learning)", "비지도 학습 (Unsupervised learning)", "강화 학습 (Reinforcement learning)", "딥러닝 (Deep learning)"], "a": 1, "e": "비지도 학습(Unsupervised learning)은 라벨이 없는 데이터를 사용하여 그룹화와 패턴을 찾는 학습 방식입니다. [cite: 918]"}, {"q": "조직이 AI/ML 모델의 위험을 관리하고 보안을 보장하도록 돕기 위해 Google에서 제공하는 프레임워크는 무엇입니까? [cite: 924]", "o": ["RAG (Retrieval-Augmented Generation)", "MLOps", "SAIF (Secure AI Framework)", "AutoML"], "a": 2, "e": "SAIF(Secure AI Framework)는 조직이 AI 및 ML 모델의 위험을 관리하고 보안을 보장하도록 돕는 프레임워크입니다. [cite: 924]"}, {"q": "성공적인 생성형 AI 전략 수립을 위해 권장되는 접근 방식은 무엇입니까? [cite: 960]", "o": ["경영진 주도의 하향식(top-down) 접근 방식만 전적으로 사용한다.", "실무자 중심의 상향식(bottom-up) 접근 방식만 전적으로 사용한다.", "비전과 전략을 설정하는 하향식 접근과, 실용적 적용을 식별하는 상향식 접근을 결합한다.", "외부 컨설턴트에게 모든 기획과 실행을 위임한다."], "a": 2, "e": "권장되는 생성형 AI 전략은 리더십이 비전을 설정하는 '하향식(top-down)' 방식과 직원이 실용적인 적용 사례를 찾고 피드백을 제공하는 '상향식(bottom-up)' 방식을 결합하는 것입니다. [cite: 960]"}, {"q": "AI 모델을 안내하여 다른 프롬프트를 스스로 생성하거나, 수정 또는 해석하도록 하는 프롬프팅 기법은 무엇입니까? [cite: 882]", "o": ["ReAct (Reason and act)", "프롬프트 체이닝 (Prompt Chaining)", "메타프롬프팅 (Metaprompting)", "퓨 샷(Few-shot) 프롬프팅"], "a": 2, "e": "메타프롬프팅(Metaprompting)은 AI 모델을 안내하여 다른 프롬프트를 생성, 수정 또는 해석하도록 하는 기법입니다. [cite: 882]"}, {"q": "한 기업이 생성형 AI 기반 고객지원 챗봇을 개발 중입니다. 모델의 원래 학습 데이터에 없는 최근 업데이트된 제품 정보를 포함해 다양한 고객 질문에 정확히 답하도록 하려고 합니다. 이 챗봇에 RAG(검색 증강 생성)를 적용할 때 얻는 핵심 이점은?", "o": ["RAG는 생성형 AI 모델을 실행하는 데 필요한 컴퓨팅 자원을 크게 줄여준다.", "RAG는 주로 챗봇이 더 창의적이고 흥미로운 대화 응답을 생성하도록 돕는다.", "RAG는 챗봇이 고객과의 상호작용을 바탕으로 기반 언어 모델을 즉석에서 파인튜닝하게 해준다.", "RAG는 챗봇이 외부의 최신 지식 소스에 접근·활용해 더 정확하고 관련성 높은 답변을 제공하게 해준다."], "a": 3, "e": "RAG는 모델을 실시간으로 재학습하는 방식이 아니라, 외부의 최신 지식을 검색해 응답 문맥에 제공한다. 따라서 최신 제품 정보에도 더 정확하게 답할 수 있다."}, {"q": "한 기업이 성공 가능성이 높고 영향력이 큰 생성형 AI(gen AI) 사용 사례를 선택하려 합니다. Google Cloud 권장 방식에 따르면 가장 먼저 무엇을 파악해야 할까요?", "o": ["새로운 gen AI 도구를 교육받을 직원 수", "회사가 해결하고자 하는 구체적인 비즈니스 문제와 원하는 결과", "다양한 클라우드 플랫폼에서 제공되는 사전학습 모델의 가용성", "여러 gen AI 플랫폼이 사용하는 기반 모델의 업데이트 빈도"], "a": 1, "e": "성공 가능성이 큰 gen AI use case는 먼저 해결할 business problem과 측정 가능한 desired outcome을 분명히 해야 한다. 도구나 모델 선택은 그 다음 단계다."}, {"q": "사용자가 생성형 AI 모델에게 유명 SF 영화의 과학적 정확성에 대해 질문했습니다. 모델은 인간이 실제로 빛보다 빠르게 이동할 수 있다고 자신 있게 답하며, 영화 속 \"정립된 과학\"에 따른 구체적이지만 완전히 허구인 이론과 설명을 근거로 제시합니다. 모델은 이를 허구에서 비롯된 것임을 밝히지 않고 사실처럼 제시합니다. 이는 어떤 유형의 모델 한계인가요?", "o": ["편향(Bias)", "지식 컷오프(Knowledge cutoff)", "데이터 의존성(Data dependency)", "환각(Hallucination)"], "a": 3, "e": "허구의 내용을 사실처럼 자신 있게 만들어 내고 출처나 불확실성을 밝히지 않는 현상은 Hallucination이다."}, {"q": "한 조직이 웹사이트와 앱에서 초기 고객 문의를 자동화하고 자주 묻는 질문에 즉시 응답하여 고객 서비스 가용성을 높이고 일상적인 업무로 인한 실시간 상담원 팀의 부담을 줄이려 합니다. 자연스럽고 매력적인 방식으로 고객 질문을 이해·응답할 수 있으며, 규칙 기반 로직과 생성형 AI 기능을 함께 사용할 수 있는 솔루션이 필요합니다. Google Customer Engagement Suite의 어떤 구성요소를 사용해야 할까요?", "o": ["Google Cloud Contact Center as a Service", "Agent Assist", "Conversational Insights", "Conversational Agents"], "a": 3, "e": "Conversational Agents는 웹과 앱에서 자연어 대화를 자동화하는 구성요소다. rule-based logic과 generative AI를 함께 활용할 수 있다."}, {"q": "한 연구기업이 재무보고서가 담긴 여러 개의 긴 PDF 문서를 분석해 지난 1년간의 핵심성과지표(KPI)와 추세를 파악해야 합니다. 원문에서 직접 인용(citation)과 함께 요약된 통찰을 제공할 수 있는 Google Cloud의 사전 구축된 생성형 AI 도구를 원합니다. 분석가는 무엇을 해야 할까요?", "o": ["Gemini Advanced에서 미리 정의한 KPI로 여러 재무보고서를 살펴볼 수 있는 맞춤 Gem을 만든다.", "Gemini 앱을 사용해 일반적인 재무 동향 질문을 한다.", "NotebookLM을 사용해 문서를 업로드하고 분석한다.", "Google Docs 내 Gemini for Google Workspace를 사용해 보고서 일부를 복사·붙여넣기 해 요약·분석한다."], "a": 2, "e": "NotebookLM은 업로드한 문서를 근거로 요약·분석하고 source citation을 연결해 준다. 여러 PDF에서 KPI와 추세를 찾는 목적에 적합하다."}, {"q": "한 조직이 직원 출장 예약을 위한 생성형 AI 에이전트를 구축하고 있습니다. 에이전트는 가용성, 가격, 예약을 위해 외부 항공사·호텔 시스템에 연결해야 합니다. Google Cloud 권장 방식에 따라 에이전트가 외부 여행 공급업체 시스템과 상호작용하는 가장 간단하고 효과적인 방법을 구현하려면 어떤 방법을 써야 할까요?", "o": ["여행 API와 상호작용하기 위한 에이전트 내 함수(Functions)", "항공·호텔 정보를 미리 적재한 데이터 스토어", "여행 API와의 표준화된 에이전트 상호작용을 위한 익스텐션(Extensions)", "여행 예약 기능을 추가하기 위한 플러그인(Plugins)"], "a": 2, "e": "Extensions는 agent가 외부 API와 표준화된 방식으로 연결되도록 한다. 실시간 항공·호텔 조회와 예약 같은 외부 작업에 알맞다."}, {"q": "한 기업의 영업팀이 잠재고객을 조사하고 CRM 도구에 데이터를 수동으로 입력하는 데 상당한 시간을 쓰고 있습니다. 팀의 효율을 높이고 관계 구축과 거래 성사에 집중하도록 하려면 조직은 무엇을 해야 할까요?", "o": ["CRM을 인기 있는 영업 인텔리전스 플랫폼과 통합해 리드 프로필을 자동으로 보강한다.", "Google Cloud의 AutoML Natural Language를 활용해 리드 커뮤니케이션을 분석하고 CRM을 자동 업데이트하는 맞춤 AI 솔루션을 개발한다.", "Gemini Enterprise의 '통합 엔터프라이즈 검색'과 CRM 에이전트를 도입해 리드 조사와 데이터 입력을 자동화한다.", "Google Cloud의 Contact Center AI를 도입해 리드를 선별하고 적절한 영업 담당자에게 배정한다."], "a": 2, "e": "unified enterprise search와 CRM agent는 기업 데이터 검색과 반복적인 lead research·data entry 자동화를 결합해 영업팀의 수작업을 줄인다."}, {"q": "한 기업이 생성형 AI 모델을 사용해 고객 대상 마케팅 콘텐츠를 개인화하고 있습니다. 모델 학습에 사용된 고객 데이터에는 이름과 구매 이력이 포함됩니다. 개인화의 이점과 고객 프라이버시 보호 필요성을 균형 있게 맞추려면 이 데이터를 처리할 때 어떤 기법을 써야 할까요?", "o": ["가명처리(pseudonymization)를 사용해 직접 식별자를 인공 식별자로 대체한다.", "고객 데이터를 안전하게 암호화된 서버에 저장한다.", "AI 모델에 데이터를 사용하는 것에 대해 고객으로부터 명시적 동의를 받는다.", "AI 모델의 출력이 차별적이지 않은지 정기적으로 감사한다."], "a": 0, "e": "Pseudonymization은 이름 같은 직접 식별자를 인공 식별자로 바꿔 개인 식별 위험을 낮추면서 분석에 필요한 연결 가능성은 유지한다."}, {"q": "한 조직이 ML 모델 학습을 성공적으로 마치고 이제 ML 라이프사이클의 모델 배포 단계에 있습니다. ML 라이프사이클 전반의 보안을 보장해야 합니다. 이 단계에서 구현해야 할 핵심 보안 관행은?", "o": ["모델 생성 후 모든 학습 데이터를 영구 삭제한다.", "투명성을 위해 모델 아키텍처 세부사항을 공개한다.", "새로운 데이터셋으로 모델을 정기적으로 재학습한다.", "배포된 모델에 대한 접근과 데이터 흐름을 통제한다."], "a": 3, "e": "배포 단계에서는 누가 모델에 접근하고 어떤 데이터가 오가는지를 통제해야 한다. access control과 data-flow control이 핵심 보안 조치다."}, {"q": "한 기업이 생성형 AI 전략을 수립 중입니다. 성공 가능성을 높이기 위해 Google 권장 방식을 따르려 합니다. 어떤 전략을 사용해야 할까요?", "o": ["상향식(Bottom-up) 전략", "신속 도입(Rapid implementation) 전략", "하향식(Top-down) 전략", "다방향(Multi-directional) 전략"], "a": 2, "e": "Top-down strategy는 경영 목표와 use case를 정렬하고 조직 차원의 우선순위·책임을 만든다. 이 때문에 gen AI 도입의 성공 가능성을 높인다."}, {"q": "파운데이션 모델(foundation model)의 정의는 무엇인가요?", "o": ["방대한 데이터셋으로 학습된, 종종 멀티모달이며 다양한 문제 해결에 적용할 수 있는 대규모 AI 모델", "방대한 데이터셋으로 학습되어 감성 분석에 사용할 수 있는 통계적 언어 모델", "데이터로부터 학습하기 위해 인공신경망을 사용하는 머신러닝의 한 유형", "텍스트와 데이터를 처리·해석하기 위해 머신러닝을 사용하는 인공지능의 하위 분야"], "a": 0, "e": "foundation model은 방대한 데이터로 사전 학습된 범용 모델이며, 여러 작업에 맞게 adaptation할 수 있다. 종종 multimodal capability도 가진다."}, {"q": "한 기업이 고객 서비스 포털에 자주 묻는 질문을 처리하는 새로운 생성형 AI 챗봇을 출시했습니다. 이 챗봇이 계속 잘 작동하는지 시간에 따라 성과를 모니터링하려 합니다. 어떤 Google 권장 방식을 써야 할까요?", "o": ["챗봇의 다양한 대화 흐름에 대한 A/B 테스트", "챗봇 상호작용에 대한 human-in-the-loop(HITL) 검토 프로세스 사용", "핵심성과지표(KPI)를 정의하고 추적", "챗봇에게 스스로 성과를 평가하도록 프롬프트하기"], "a": 2, "e": "chatbot의 성과를 지속적으로 확인하려면 KPIs를 정하고 추적해야 한다. 예를 들어 해결률, 만족도, escalation rate 등을 시간에 따라 측정한다."}, {"q": "한 소프트웨어 개발자가 챗봇 애플리케이션을 빠르게 프로토타이핑하기 위해 로컬 머신에서 파인튜닝할 수 있는, 매우 효율적인 오픈소스 대규모 언어 모델이 필요합니다. 자연어 이해·생성 성능이 뛰어나면서도 제한된 하드웨어에서 실행 가능할 만큼 경량이어야 합니다. 어떤 Google 개발 모델 계열을 사용해야 할까요?", "o": ["Veo", "Gemini", "Imagen", "Gemma"], "a": 3, "e": "Gemma는 Google의 open model family로 비교적 효율적인 local deployment와 fine-tuning에 적합하다. Veo·Imagen은 각각 video·image 생성 모델이다."}, {"q": "한 기업이 고객 리뷰를 긍정·부정·중립으로 분류하는 모델을 구축하려 합니다. 수천 건의 고객 리뷰를 수집했고, 각 리뷰에는 해당하는 감성(긍정·부정·중립) 라벨이 수동으로 태깅되어 있습니다. 어떤 머신러닝을 사용해야 할까요?", "o": ["강화학습(Reinforcement learning)", "비지도학습(Unsupervised learning)", "지도학습(Supervised learning)", "딥러닝(Deep learning)"], "a": 2, "e": "각 review에 positive·negative·neutral label이 이미 붙어 있으므로 입력과 정답 label을 학습하는 supervised learning 문제다."}, {"q": "한 매니저가 자신의 AI 모델에 양질의 데이터만 사용되도록 하려 합니다. 다음 중 불공정하고 편향된 결과로 이어질 가능성이 가장 높은 시나리오는?", "o": ["마케팅팀이 봇 트래픽이 포함된 웹사이트 클릭스트림 데이터를 바탕으로 개인화 추천 엔진을 만든다.", "금융기관이 상당 비율의 거래에서 가맹점 정보가 누락된 불완전한 거래 데이터로 사기 탐지 모델을 구축한다.", "한 기술기업이 하나의 인구통계 집단 이미지를 위주로, 다른 집단은 제한적으로 대표된 데이터로 얼굴 인식 시스템을 학습시킨다.", "한 기업의 고객서비스 자연어 처리 모델이 이전 웹사이트 버전에서 잘못 인코딩된 텍스트가 포함된 데이터셋으로 학습된다."], "a": 2, "e": "특정 demographic에 치우친 얼굴 이미지로 학습하면 다른 집단에서 오류가 커질 수 있다. 이는 representation 부족이 만드는 unfair bias의 전형이다."}, {"q": "생성형 AI(gen AI) 생태계에서 플랫폼 계층(platform layer)의 기능은 무엇인가요?", "o": ["사용자가 AI 기능과 상호작용하고 이를 활용하도록 해준다.", "생성형 AI 모델을 학습·실행하는 데 필요한 컴퓨팅 자원을 제공한다.", "사전학습된 gen AI 모델에 대한 접근을 제공한다.", "사용자가 gen AI 모델과 상호작용하고 AI 솔루션을 구축·배포할 수 있는 도구를 제공한다."], "a": 3, "e": "platform layer는 사용자가 gen AI model을 활용하고 solution을 build·deploy할 수 있는 도구와 서비스를 제공한다. compute 자체는 infrastructure layer의 역할이다."}, {"q": "한 기업의 머신러닝 프로젝트가 스트리밍 데이터와 구조화된 데이터베이스 같은 다양한 데이터 유형을 다룹니다. Google Cloud는 이 프로젝트의 데이터 수집을 어떻게 지원하나요?", "o": ["Gemini 앱이 데이터를 직접 수집하는 주요 Google Cloud 도구다.", "Google Cloud는 외부 데이터 연결을 위해 Vertex AI에 의존한다.", "Google Cloud의 강점은 BigQuery 같은 데이터 분석 도구에 있다.", "Google Cloud는 Pub/Sub, Cloud Storage, Cloud SQL 같은 도구를 제공한다."], "a": 3, "e": "Pub/Sub는 streaming data, Cloud Storage는 파일·비정형 데이터, Cloud SQL은 관계형 데이터를 다룬다. 이 조합이 여러 형태의 데이터 수집을 지원한다."}, {"q": "한 데이터 사이언스 팀이 다양한 모델 버전을 저장·정리하고, 메타데이터를 추적하며, 각 애플리케이션에 쉽게 배포할 중앙화된 장소가 필요합니다. 어떤 Google Cloud 서비스를 사용해야 할까요?", "o": ["Vertex AI Pipelines", "Model Registry", "BigQuery", "Cloud Storage"], "a": 1, "e": "Model Registry는 model version, metadata, approval 상태를 중앙에서 관리하고 deployment에 사용할 모델을 체계적으로 추적하게 한다."}, {"q": "한 금융기관이 대출 신청을 승인·거절하는 데 생성형 AI(gen AI)를 사용하지만, 거절 사유를 제공하지 않습니다. 고객들이 불만을 제기하기 시작했습니다. 회사는 불만을 줄이기 위한 솔루션을 도입해야 합니다. 무엇을 해야 할까요?", "o": ["gen AI 모델을 위해 더 크고 다양한 데이터셋을 수집한다.", "설명 가능한(explainable) gen AI 정책을 도입한다.", "gen AI 모델을 파인튜닝한다.", "gen AI 모델의 공정성 평가를 개발한다."], "a": 1, "e": "대출 거절 이유를 설명하지 못해 불만이 생긴 상황이므로 explainable gen AI policies가 필요하다. 더 많은 데이터나 fine-tuning만으로 설명 책임이 생기지는 않는다."}, {"q": "한 소프트웨어 개발팀이 소프트웨어 프로토타입을 더 빠르게 출시하기 위해 생성형 AI(gen AI)로 코딩 속도를 높이려 합니다. 팀은 무엇을 해야 할까요?", "o": ["gen AI를 사용해 기존 코드를 리팩터링하고 최적화한다.", "gen AI를 사용해 코드 스니펫을 제안하고 함수를 완성한다.", "gen AI를 사용해 코드에 대한 종합적인 문서를 자동 생성한다.", "gen AI를 사용해 코드의 잠재적 버그와 보안 취약점을 식별한다."], "a": 1, "e": "prototype을 빠르게 만들려면 gen AI가 code snippet을 제안하고 function completion을 돕게 하는 것이 직접적이다. 이후 refactoring·testing은 보조 활용이다."}, {"q": "생성형 AI의 정의는 무엇인가요?", "o": ["신경망과 딥러닝을 사용해 시스템이 자율적으로 학습·개선하도록 하는 인공지능의 한 유형", "텍스트, 이미지, 음악, 코드 등 새로운 콘텐츠와 아이디어를 만들어낼 수 있는 인공지능의 한 유형", "인간의 뇌에서 영감을 받아 상호 연결된 노드로 구성된 머신러닝 알고리즘의 한 유형", "관측된 데이터에 선을 맞춰 관계를 추정하는 예측 모델의 한 유형"], "a": 1, "e": "generative AI의 핵심은 text, image, music, code처럼 새로운 content와 idea를 생성하는 능력이다."}, {"q": "한 기업이 생성형 AI 솔루션을 구축·배포·관리하는 데 필요한 인프라, 도구, 사전학습 모델을 제공하는 생성형 AI 플랫폼을 원합니다. 어떤 Google Cloud 오퍼링을 사용해야 할까요?", "o": ["BigQuery", "Vertex AI", "Google Kubernetes Engine (GKE)", "Google Cloud Storage"], "a": 1, "e": "Vertex AI는 foundation model, 개발 도구, training, deployment, management를 한 플랫폼에서 제공하므로 이 요구에 맞는다."}, {"q": "Google Cloud를 생성형 AI 기업으로서 특징짓는 요소는 무엇인가요?", "o": ["Google Cloud는 설정이나 관리 부담이 전혀 없는 완전 자율 AI 에이전트를 제공한다.", "Google Cloud는 AI 우선(AI-first) 철학을 바탕으로 지속적인 업데이트와 플랫폼 전반의 폭넓은 통합을 통해 혁신을 촉진한다.", "Google Cloud는 모든 생성형 AI 모델과 데이터를 외부 네트워크로부터 완전히 격리·보안한다.", "Google Cloud는 최대 보안을 위해 독점적인 폐쇄형 AI 기술에 의존한다."], "a": 1, "e": "Google Cloud의 강점은 AI-first innovation, 지속적인 업데이트, 그리고 cloud platform 전반의 폭넓은 integration이다. 완전 무관리나 폐쇄성은 특징이 아니다."}, {"q": "한 글로벌 뉴스 매체가 온라인에 올라오는 속보 기사를 빠르게 요약하는 생성형 AI 도구를 개발하고 있습니다. 다양한 글로벌 소스에서 빠르게 전개되는 이슈에 대해 독자에게 신속한 업데이트를 제공하는 것이 목표입니다. 어떤 Google Cloud 솔루션을 사용해야 할까요?", "o": ["Document AI", "BigQuery", "Vertex AI Natural Language API", "Grounding with Google Search"], "a": 3, "e": "breaking news처럼 계속 바뀌는 정보에는 Grounding with Google Search가 최신 웹 정보를 응답 근거로 연결하는 데 적합하다."}, {"q": "한 기업이 학생들에게 개인화된 학습 경험을 제공하는 AI 기반 교육 솔루션을 만들려 합니다. 이 플랫폼은 학생의 지식 수준을 평가하고, 관련 학습 자료를 추천하며, 맞춤형 연습문제를 생성합니다. 애플리케이션은 수업 구조를 제공하고 진도를 추적합니다. 어떤 유형의 AI 솔루션을 사용해야 할까요?", "o": ["학습 자료를 위한 AI 기반 추천 시스템", "교육 콘텐츠로 파인튜닝된 대규모 언어 모델", "학습 관리 시스템(LMS)", "맞춤형 학습 에이전트"], "a": 3, "e": "이 solution은 수준 평가, 자료 추천, exercise 생성, lesson 구조와 progress tracking을 함께 수행해야 한다. 여러 단계의 학습 지원을 조율하는 customized learning agent가 가장 알맞다."}, {"q": "방대하고 자주 업데이트되는 제품 카탈로그를 보유한 대형 이커머스 기업이, 고객이 웹사이트에서 제품을 찾는 데 어려움을 겪고 상담원도 세부 제품 정보를 찾는 데 너무 많은 시간을 쓴다는 것을 발견했습니다. 고객과 상담원 모두를 위해 검색 정확도와 효율을 높이려면 어떤 Google Cloud 솔루션을 사용해야 할까요?", "o": ["Vertex AI Conversation", "Vertex AI Natural Language API", "Vertex AI Search의 사전 구축된 RAG", "Vertex AI Model Garden"], "a": 2, "e": "제품 catalog가 자주 바뀌는 경우 pre-built RAG with Vertex AI Search가 최신 제품 문서를 검색해 grounding된 답을 제공하므로 검색 정확도와 지원 효율을 함께 높인다."}, {"q": "한 기업이 대화형 AI 챗봇을 개발 중입니다. 챗봇이 사람과 같은 대화를 나누고 정확한 정보를 제공하도록 해야 합니다. 사용자 프롬프트를 이해·응답하는 챗봇의 능력을 향상시키려면 무엇을 해야 할까요?", "o": ["퓨샷(few-shot) 프롬프팅 같은 프롬프트 엔지니어링 기법을 사용해 챗봇에 성공적인 상호작용 예시를 제공한다.", "무관한 정보를 학습하지 않도록 챗봇의 학습 데이터를 제한한다.", "챗봇이 특정 명령에만 응답하도록 엄격한 키워드 매칭을 사용한다.", "더 일관되고 예측 가능한 응답을 위해 모델의 temperature 설정을 낮춘다."], "a": 0, "e": "few-shot example을 포함한 prompt engineering은 원하는 대화 방식과 응답 형식을 모델에 명확히 보여 준다. 단순 keyword matching보다 자연스러운 대화에 유리하다."}, {"q": "한 소셜미디어 플랫폼이 생성형 AI 모델을 사용해 사용자 게시물을 자동으로 요약해 다른 사용자에게 빠른 개요를 제공합니다. 사실적인 게시물에 대해서는 대체로 정확하지만, 모델이 가끔 풍자나 반어법, 미묘한 의견을 잘못 해석해 원래 의도를 왜곡하는 요약을 만들어 사용자 간 오해나 불쾌감을 유발할 수 있습니다. 이 AI 생성 요약의 한계를 극복하려면 플랫폼은 무엇을 해야 할까요?", "o": ["잘못 해석될 소지가 있는 콘텐츠를 아예 걸러내도록 더 엄격한 안전 설정을 적용한다.", "더 다양하고 덜 문자적인 해석을 유도하기 위해 모델의 temperature 매개변수를 높인다.", "요약을 더 간결하게 만들기 위해 출력 길이를 줄인다.", "요약을 다듬기 위한 human-in-the-loop(HITL) 검토 프로세스를 도입한다."], "a": 3, "e": "sarcasm·satire·미묘한 의견은 자동 요약이 오해하기 쉽다. HITL review가 위험한 요약을 사람이 검토·수정하게 해 오해를 줄인다."}, {"q": "실시간 상담원 팀을 보유한 한 조직이 지원 상호작용에서 상담원의 효율성과 고객 만족도를 높이려 합니다. 대화를 완전히 자동화하지 않으면서 상담원에게 실시간 안내와 유용한 정보를 제공하고 지원 프로세스를 간소화하는 도구를 찾고 있습니다. Google Customer Engagement Suite의 어떤 구성요소를 사용해야 할까요?", "o": ["Agent Assist", "Conversational Agents", "Conversational Insights", "Google Cloud Contact Center as a Service"], "a": 0, "e": "Agent Assist는 live customer service agent에게 실시간 추천과 관련 정보를 제공한다. 대화를 완전히 자동화하는 chatbot 역할과는 다르다."}, {"q": "규제가 엄격한 한 금융기관이 엄격하게 미리 정의된 기준에 따라 대출 신청을 결정론적으로 승인·거절하는 대출 승인 시스템의 핵심 의사결정 엔진으로 Gemini를 사용하려 합니다. 이것이 Gemini에 부적절한 사용 사례인 이유는?", "o": ["Gemini는 필요한 금융 데이터베이스와 통합할 수 없다.", "Gemini는 금융 평가를 위한 구조화된 숫자 데이터를 처리하기에 적합하지 않다.", "Gemini는 유연한 콘텐츠 생성과 추론을 위해 설계된 것이지, 엄격한 규칙 기반 의사결정을 위한 것이 아니다.", "이 시나리오에 Gemini를 배포하는 것은 비용이 너무 많이 들고 복잡하다."], "a": 2, "e": "Gemini는 유연한 생성과 추론을 위한 모델이므로 고정 규칙에 따른 deterministic loan approval engine으로 쓰기에는 부적절하다."}, {"q": "생성형 AI를 가장 잘 정의하는 것은?", "o": ["데이터베이스 저장소의 한 유형", "텍스트, 이미지, 코드, 음악 등 새로운 콘텐츠를 만드는 AI", "네트워크 보안 도구", "클라우드 청구 서비스"], "a": 1, "e": "generative AI는 text, image, code, music 등 새로운 content를 생성한다. database storage나 billing 기능 자체를 뜻하지 않는다."}, {"q": "AI 모델을 구축·학습·배포하는 데 중점을 둔 Google Cloud 제품은?", "o": ["Cloud DNS", "Vertex AI", "Cloud Storage", "BigQuery"], "a": 1, "e": "Vertex AI는 AI model을 build, train, deploy하는 Google Cloud의 통합 플랫폼이다."}, {"q": "AI 응답을 사실적 데이터에 근거하게(ground) 만드는 데 도움이 되는 기법은?", "o": ["수동 코드 편집", "검색 증강 생성(RAG)", "브라우저 캐싱", "정적 사이트 호스팅"], "a": 1, "e": "RAG는 신뢰할 수 있는 문서를 검색해 답변과 함께 사용하므로 사실성·검증 가능성을 높이는 grounding technique다."}, {"q": "프롬프트 엔지니어링의 목적은 무엇인가요?", "o": ["파일을 압축하기 위해", "모델이 더 나은 출력을 내도록 입력을 구조화하기 위해", "클라우드 API를 보호하기 위해", "청구를 관리하기 위해"], "a": 1, "e": "prompt engineering은 모델이 더 적절한 출력을 만들도록 instruction, context, format, example을 구조화하는 작업이다."}, {"q": "비즈니스 사용 사례에서 책임감 있는 AI(responsible AI)가 중요한 이유는?", "o": ["더 빠른 청구를 위해", "환각과 편향을 줄이고 윤리적 사용을 보장하기 위해", "클라우드 리전 선택을 위해", "화면 해상도 설정을 위해"], "a": 1, "e": "responsible AI는 hallucination과 bias의 위험을 줄이고, 안전성·공정성·책임성을 고려해 business use case의 피해를 막는다."}, {"q": "대화형 또는 작업 지향형 에이전트를 생성하는 데 도움이 되는 Google Cloud 도구는?", "o": ["Cloud SQL", "Gemini와 Vertex AI 에이전트 도구", "Cloud Load Balancing", "Firebase Hosting"], "a": 1, "e": "Gemini와 Vertex AI의 agent tools는 대화형 또는 task-oriented agent를 만들고 tool use를 연결하는 데 사용한다."}, {"q": "책임감 있는 AI 거버넌스(responsible AI governance)란 무엇인가요?", "o": ["안전하고 공정한 Gen AI 사용을 위한 프레임워크", "청구 주기를 단축하는 방법", "자동화된 서버 프로비저닝", "UI 테마 옵션"], "a": 0, "e": "responsible AI governance는 gen AI를 secure하고 fair하며 accountable하게 사용하기 위한 정책·절차·통제 체계다."}, {"q": "Gen AI 프로젝트의 비즈니스 영향을 측정하는 개념은?", "o": ["저장된 바이트 수", "ROI(투자수익률)와 KPI 정합성", "화면 재생 빈도", "키보드 지연 시간"], "a": 1, "e": "ROI와 KPI alignment는 비용·효과·목표 달성도를 연결해 gen AI project의 business impact를 측정한다."}, {"q": "대규모 언어 모델(LLM)이 Gen AI에서 중요한 이유는:", "o": ["고객 이메일을 저장하기 때문에", "사람과 같은 텍스트와 추론을 생성할 수 있기 때문에", "데이터를 압축하기 때문에", "네트워킹을 관리하기 때문에"], "a": 1, "e": "LLMs는 자연어를 이해하고 생성해 human-like text와 추론 보조를 제공하므로 Gen AI의 핵심 모델로 쓰인다."}, {"q": "Google의 Gen AI 오퍼링이 갖는 핵심 이점 중 하나는:", "o": ["수동 청구만 가능하다는 점", "Vertex AI, Gemini 등 여러 도구를 아우르는 통합된 엔터프라이즈 준비 완료 AI 플랫폼이라는 점", "모바일 앱 호스팅만 가능하다는 점", "오프라인 가상화라는 점"], "a": 1, "e": "Google의 Gen AI offering은 Vertex AI와 Gemini 등을 연결한 unified, enterprise-ready platform이라는 점이 장점이다."}, {"q": "한 조직이 길고 방대한 고객 피드백 텍스트 전사본을 분석·요약하는 AI 도구가 필요합니다. 컨텍스트 윈도우가 큰 Google 파운데이션 모델을 선택해야 합니다. 어떤 파운데이션 모델을 선택해야 할까요?", "o": ["Gemini", "CodeGemma", "Imagen", "Chirp"], "a": 0, "e": "긴 transcript를 한 번에 읽고 요약하려면 large context window가 중요하다. Gemini는 긴 문맥을 처리하는 foundation model family다."}, {"q": "한 개발팀이 고객 대상 애플리케이션을 위해 생성형 AI 모델을 구성하면서 생성되는 콘텐츠가 적절하고 무해하도록 하려 합니다. 생성형 AI 모델에서 안전 설정(safety settings) 매개변수의 주요 기능은 무엇인가요?", "o": ["간결한 응답을 보장하기 위해 모델이 생성하는 최대 텍스트 길이를 제한한다.", "입력·출력의 복잡성과 길이에 영향을 미쳐 모델이 한 번에 처리할 수 있는 토큰 수를 결정한다.", "원하는 필터링 수준에 따라 모델 출력에서 유해하거나 부적절할 수 있는 콘텐츠를 걸러낸다.", "단어 선택의 다양성을 조정해 모델 출력의 창의성과 무작위성을 제어한다."], "a": 2, "e": "safety settings는 harmful하거나 inappropriate한 output을 지정한 수준으로 차단·완화하는 filtering control이다. creativity나 token length를 정하는 값이 아니다."}, {"q": "한 조직이 생성형 AI로 마케팅 캠페인을 만들려 합니다. AI 모델이 타깃 대상에게 적합한 텍스트를 생성하도록 해야 합니다. 조직은 무엇을 해야 할까요?", "o": ["롤 프롬프팅(role prompting)을 사용한다.", "프롬프트 체이닝(prompt chaining)을 사용한다.", "퓨샷(few-shot) 프롬프팅을 사용한다.", "temperature 매개변수를 조정한다."], "a": 0, "e": "role prompting은 모델에 역할·관점·대상 독자를 지정해 tone과 적합성을 조절한다. target audience에 맞는 marketing text를 유도하는 데 적합하다."}, {"q": "한 기업이 생성형 AI(gen AI) 솔루션을 최적화할 플랫폼을 결정하려 합니다. 이 기업이 Vertex AI Platform을 사용해야 하는 이유는?", "o": ["머신러닝에 사용되는 대규모 데이터셋을 효율적으로 분석·탐색하는 메커니즘을 제공한다.", "엔터프라이즈급 보안과 프라이버시 보호를 갖춘 gen AI 코딩 지원을 제공한다.", "머신러닝 워크플로우에 사용되는 데이터를 위한 확장 가능하고 비용 효율적인 오브젝트 스토리지를 제공한다.", "머신러닝을 구축·배포·관리하기 위한 통합 도구 플랫폼을 제공한다."], "a": 3, "e": "Vertex AI Platform은 model development부터 deployment와 management까지 이어지는 통합 ML toolset을 제공한다."}, {"q": "한 기업의 개발팀이 Google Cloud로 생성형 AI 솔루션 구축을 시작하고 싶어 하지만 AI 개발 경험이 부족합니다. gen AI 솔루션을 빠르게 출시해야 합니다. 이 목표 달성에 도움이 되는 Google Cloud의 이점은?", "o": ["Google Cloud의 사전학습 모델과 로우코드·노코드 AI 도구·서비스", "개발자를 AI 전문가와 연결해주는 Google Cloud의 협업 AI 커뮤니티와 지원 포럼", "개발자를 돕는 Google Cloud의 포괄적인 교육 자료와 튜토리얼", "지속적인 개선에 대한 Google Cloud의 집중이 제공하는 최신 AI 도구·기능·모범사례 접근성"], "a": 0, "e": "AI 경험이 적고 빠른 출시가 필요하면 pre-trained model과 low-code/no-code tool을 이용하는 것이 개발 시간과 난도를 가장 크게 낮춘다."}, {"q": "CISO 사무국이 사건 정보 요약, 위협 조사, 탐지 규칙 생성 같은 작업을 자동화하는 데 생성형 AI(gen AI)를 사용하려 합니다. 어떤 에이전트를 사용해야 할까요?", "o": ["보안 에이전트(Security agent)", "데이터 에이전트(Data agent)", "코드 에이전트(Code agent)", "고객서비스 에이전트(Customer service agent)"], "a": 0, "e": "case summary, threat research, detection rule 생성은 보안 운영 업무다. 이 목적에는 Security agent가 맞는다."}, {"q": "한 마케팅팀이 소셜미디어·광고 캠페인을 만들기 위해 파운데이션 모델을 사용하려 합니다. 텍스트로부터 기사와 이미지를 만들고 싶어 합니다. 깊은 AI 전문성은 없으며 다재다능한 솔루션이 필요합니다. 어떤 Google 파운데이션 모델을 사용해야 할까요?", "o": ["Gemma", "Imagen", "Gemini", "Veo"], "a": 2, "e": "Gemini는 text와 image를 다룰 수 있는 versatile multimodal model family다. Imagen은 image 생성에 특화되고 Veo는 video 생성에 특화된다."}, {"q": "한 지역 비영리단체의 커뮤니케이션 담당자가 36시간 내에 세련된 이해관계자 업데이트 영상을 제작해야 합니다. 원본 소스는 Google 문서와 약 20장의 사진이 담긴 Drive 폴더이며, 예산도 없고 편집 도구 사용 경험도 없습니다. 스토리보드를 빠르게 구성하고, 일관된 브랜드 룩을 적용하며, 나레이션을 생성해 검토용 완성 영상을 내보낼 수 있는 도구를 원합니다. 이런 업무 사용자를 위한 \"영상 제작 어시스턴트\" 역할을 하도록 설계된 사전 구축 Google AI 제품은?", "o": ["Veo", "Google Vids", "Gemini", "Vertex AI"], "a": 1, "e": "Google Vids는 문서·이미지에서 storyboard를 구성하고 visual style과 voiceover를 지원하는 business-oriented video production assistant다."}, {"q": "BlueTrail Freight라는 중견 물류회사가 약 2주마다 갱신되는 기업 HR 저장소(약 80개 파일)의 최신 문서에 각 응답을 근거하게(grounding) 하여 직원의 HR 정책 질문에 답하는 내부 어시스턴트를 출시하려 합니다. 맞춤 개발을 최소화하면서 검색 증강 생성(RAG) 패턴으로 생성형 모델을 사내 문서에 빠르게 연결하는 Google Cloud 방식을 원합니다. 어떤 솔루션을 선택해야 할까요?", "o": ["GKE에서 처음부터 맞춤 벡터 저장소·검색 스택을 구축한다.", "Document AI로 텍스트를 추출한 뒤 검색 계층 없이 모델을 호출한다.", "Vertex AI Search의 사전 구축 RAG를 사용해 HR 저장소를 색인하고 근거로 삼는다.", "검색 단계 없이 HR 문서로 파운데이션 모델을 파인튜닝한다."], "a": 2, "e": "Vertex AI Search의 prebuilt RAG는 private repository를 index하고 검색 결과로 모델을 grounding한다. 별도 retrieval stack을 처음부터 만들 필요가 없다."}, {"q": "MealWhiz 앱의 대화형 AI가 사용자에게 요리 아이디어를 찾아줍니다. 사용자가 \"비건 라자냐\" 레시피를 요청하면 에이전트는 타사 요리 카탈로그 API에 접속해 평점이 높은 비건 라자냐 레시피 여러 개를 가져온 뒤 사용자에게 요약해 줍니다. 이 아키텍처에서 요리 카탈로그 API의 역할은?", "o": ["모델의 추론과 형식을 이끄는 프롬프트 엔지니어링 패턴을 나타낸다.", "맥락 유지를 위해 에이전트의 대화 이력을 저장하는 메모리 계층 역할을 한다.", "모델이 본래 갖고 있지 않은 최신 레시피 데이터를 가져오기 위해 에이전트가 호출하는 외부 도구다.", "런타임에 변경할 수 없는 파운데이션 모델의 정적 사전학습 지식에 속한다."], "a": 2, "e": "cuisine catalog API는 model이 원래 알고 있지 않은 최신 recipe 정보를 가져오는 external tool이다. agent는 그 결과를 바탕으로 응답을 만든다."}, {"q": "상호작용이 끝난 뒤 대규모로 통화·채팅 전사본을 자동 분석해 주제를 클러스터링하고, 감성을 측정하며, 새롭게 부상하는 불만 트렌드를 파악해주는 Google Cloud 제품은?", "o": ["Dialogflow CX", "CCAI Insights", "Vertex AI Pipelines", "Agent Assist"], "a": 1, "e": "CCAI Insights는 interaction이 끝난 뒤 call·chat transcript를 대규모로 분석해 topic, sentiment, trend를 파악한다."}, {"q": "패션 소매업체를 위해 일하는 한 크리에이티브 스튜디오가 피사체·분위기·카메라 프레이밍을 명시한 짧은 텍스트 설명으로부터 3일 안에 약 300장의 고유한 이미지를 제작해야 합니다. 프롬프트로부터 사실적이거나 예술적인 이미지를 생성하는 데 초점을 맞추고 스타일·구도를 세밀하게 제어할 수 있는 Google 모델이 필요합니다. 어떤 파운데이션 모델을 선택해야 할까요?", "o": ["Gemma", "Imagen", "Veo", "Gemini"], "a": 1, "e": "Imagen은 text prompt로 photorealistic 또는 artistic image를 생성하고 style·composition control을 제공하는 image generation model이다."}, {"q": "실시간 음성 번역 어시스턴트와, 6시간 내에 1,500만 건의 게시물을 태깅해야 하는 야간 배치 분류기 각각에 가장 중점을 둬야 할 성능 지표는?", "o": ["둘 다 낮은 지연시간(latency)을 우선시한다.", "어시스턴트는 낮은 응답 지연시간을, 배치 작업은 높은 처리량(throughput)을 우선시한다.", "둘 다 요청 동시성(concurrency)을 우선시한다."], "a": 1, "e": "real-time voice assistant는 사용자가 기다리지 않도록 latency가 중요하고, 대량 nightly batch job은 제한 시간 내 처리량인 throughput이 중요하다."}, {"q": "BrightHaul Logistics의 데이터 과학자가 4~5단계로 이루어진 복잡한 수학 퍼즐을 대규모 언어 모델로 풀고 있습니다. 최종 숫자만 요청하면 계속 실수가 발생합니다. 과학자가 프롬프트를 \"단계별로 생각하고, 최종 답을 주기 전에 추론 과정을 적어라\"로 수정하자 모델이 올바른 결과를 냅니다. 모델이 추론 과정을 명시적으로 펼치도록 유도하는 이 프롬프팅 방식의 이름은?", "o": ["ReAct 프롬프팅", "퓨샷(Few-shot) 프롬프팅", "사고연쇄(Chain-of-thought) 프롬프팅", "사고트리(Tree-of-thought) 프롬프팅"], "a": 2, "e": "step-by-step reasoning을 명시적으로 요청하는 방식은 Chain-of-thought prompting이다. 모델이 중간 추론을 펼치도록 유도한다."}, {"q": "example.com을 운영하는 한 교육 출판사가 7~13세 아동을 위한 공개 생성형 AI 도우미를 출시하려 합니다. 경영진은 창의성보다 유해하거나 부적절한 콘텐츠를 막는 것이 더 중요하다고 강조하며, 더 안전하지만 다소 평이한 답변도 수용하겠다고 합니다. Google Cloud에서 엄격한 콘텐츠 심의를 적용하기 위해 팀이 우선적으로 설정해야 할 매개변수는?", "o": ["Top k", "안전 설정(Safety settings)", "출력 길이(Output length)", "Temperature"], "a": 1, "e": "독성·부적절한 content를 우선 차단하려면 Safety settings를 엄격하게 설정해야 한다. temperature와 Top k는 주로 다양성과 sampling을 조절한다."}, {"q": "320개의 워커로 48시간 내에 대규모 생성형 모델을 학습시킬 수 있는 대규모 병렬 컴퓨팅을 제공하는 Google Cloud 가속기는?", "o": ["Vertex AI Training과 Dataflow", "Compute Engine과 Cloud Run", "Google Cloud TPU와 GPU"], "a": 2, "e": "TPUs와 GPUs는 대규모 병렬 연산에 특화된 accelerator로, large generative model training에 사용된다."}, {"q": "scrumtuous.com의 한 이커머스 브랜드가 추천을 개인화하고 복잡한 다중 항목 요청을 처리하는 대화형 쇼핑 어시스턴트를 출시하려 합니다. 어시스턴트는 명확화 질문을 하고, 실시간 재고·할인 대상 여부·배송 예상시간을 위해 파트너·내부 API를 호출한 뒤, 쇼핑객을 전체 결제 과정까지 안내해야 합니다. 여러 단계를 추론하고 도구를 사용할 수 있는 프로덕션급 생성형 AI 에이전트를 구축하려면 어떤 Google Cloud 오퍼링을 선택해야 할까요?", "o": ["Dialogflow CX", "Google AI Studio", "에이전트 프레임워크 없이 맞춤 Python 코드와 함께 사용하는 Gemini API", "Vertex AI Agent Builder"], "a": 3, "e": "Vertex AI Agent Builder는 multi-step reasoning, tool/API calling, conversational flow를 갖춘 production-ready generative agent를 만들도록 설계됐다."}, {"q": "생성형 모델을 비공개 문서에 근거하게(grounding) 하여 응답이 해당 문서에서 비롯되도록 하는 관리형 솔루션을 제공하는 Google Cloud 제품은?", "o": ["Cloud Search", "Document AI", "Vertex AI Search의 관리형 RAG", "정책 말뭉치로 파운데이션 모델을 파인튜닝한다."], "a": 2, "e": "Managed RAG in Vertex AI Search는 private document를 관리형 방식으로 index하고, 답변이 해당 문서를 근거로 하도록 grounding한다."}, {"q": "Riverton Retail의 제품 분석팀이 즉각적인 쇼핑 제안을 제공하는 생성형 AI 어시스턴트를 구축 중입니다. 각 고객 레코드에는 프로필 정보와 로열티 상태, 그리고 SKU와 타임스탬프를 포함한 과거 주문의 중첩 목록이 담겨 있습니다. 소스 시스템은 매주 25GB 규모의 CSV를 내보내며, 팀은 이 플랫 파일에서 중첩된 이력을 추출·정합하는 작업이 불안정하고 시간이 오래 걸려 출시가 지연되고 있음을 발견했습니다. 계층 구조를 자연스럽게 표현하고 엔지니어링·처리를 더 효율적으로 만들려면 어떤 데이터 형식을 선택해야 할까요?", "o": ["BigQuery", "JSON (JavaScript Object Notation)", "CSV", "PNG"], "a": 1, "e": "nested order history처럼 계층 구조가 있는 데이터는 JSON이 구조를 자연스럽게 표현한다. CSV는 중첩 구조를 평면화해야 해 처리 비용이 커진다."}, {"q": "한 법률 기술 스타트업이 상담 중 사건 메모를 구술하는 변호사를 위한 모바일 도구를 만들고 있습니다. 앱은 음성을 캡처해 텍스트로 변환하고 즉시 짧은 요약을 생성해야 합니다. 엄격한 의뢰인 기밀 유지와 연결이 불안정한 법원에서 작업할 가능성 때문에, 모든 전사·요약은 전적으로 휴대폰 안에서 실행되어야 하며 정보가 기기 밖으로 나가면 안 됩니다. 이 엄격한 온디바이스 배포 요구사항에 맞게 설계된 Google 파운데이션 모델은?", "o": ["Veo", "Gemma", "Imagen", "Gemini Pro"], "a": 1, "e": "Gemma는 효율적인 open model family로 on-device deployment에 적합하다. 이 요구에서는 audio와 note가 device 밖으로 나가지 않아야 한다."}, {"q": "부티크 마케팅회사의 카피 에디터가 블로그 게시물 초안 작성, 헤드라인 브레인스토밍, 리서치 노트 요약에 AI 어시스턴트를 활용합니다. 이런 창작 워크플로우를 위해 Google의 가장 강력한 모델에 접근하고 싶어 하며, 프리미엄 기능과 더 높은 사용 한도를 여는 월간 구독료를 지불할 의향이 있습니다. 이 요구를 가장 잘 충족하는 Google 오퍼링은?", "o": ["Google AI Studio", "Google AI Pro", "Gemini for Workspace Business", "무료 Gemini 앱"], "a": 1, "e": "Google AI Pro는 개인 사용자가 월 구독으로 더 강력한 Gemini model과 premium feature, 높은 usage limit을 이용하는 offering이다."}, {"q": "Skyline Retail에는 서로 다른 머신러닝 모델을 학습시키는 여러 데이터 사이언스 팀이 있습니다. 성장 분석팀은 구독 이탈 예측 모델을, 리스크팀은 지불거절(chargeback) 탐지 모델을 개발하고 있습니다. 두 팀 모두 \"customer_tenure_days\", \"avg_purchase_amount_90d\" 같은 공통 피처에 의존합니다. 경영진은 학습과 서빙에서 계산이 일관되게 유지되고 중복 엔지니어링 작업을 피하도록 이 피처들을 정의·공유·서빙하는 단일 관리형 장소를 원합니다. 이 요구를 가장 잘 충족하는 Google Cloud 제품은?", "o": ["Vertex AI Pipelines", "BigQuery", "Vertex AI Feature Store", "Vertex AI Model Registry"], "a": 2, "e": "Vertex AI Feature Store는 공통 feature를 정의·공유하고 training과 serving에서 일관되게 제공해 feature engineering 중복을 줄인다."}, {"q": "example.com의 한 편집자가 고전 중편소설의 학습 가이드를 만들기 위해 대형 파운데이션 모델을 사용합니다. 등장인물 개요를 요청하자 모델은 원작에 전혀 등장하지 않는 구체적인 에피소드와 관계로 이루어진 정교한 배경 이야기를 만들어냅니다. 글은 그럴듯하게 들리지만 원작과 상충됩니다. 이 상황이 보여주는 파운데이션 모델의 흔한 한계는?", "o": ["편향(Bias)", "컨텍스트 윈도우 한계", "환각(Hallucination)", "지식 컷오프(Knowledge cutoff)"], "a": 2, "e": "원문에 없는 상세한 배경과 관계를 그럴듯하게 만들어 낸 것은 Hallucination이다. 사실처럼 보여도 source와 충돌한다."}, {"q": "Docs, Sheets, Slides의 콘텐츠를 스토리보드로 변환하고, 스톡 영상을 제안하며, 스크립트로부터 나레이션을 생성하는 데 AI를 사용하는 Google Workspace 제품은?", "o": ["Gemini for Workspace", "Google Vids", "Vertex AI", "Gemini가 적용된 Google Slides"], "a": 1, "e": "Google Vids는 Docs, Sheets, Slides의 내용을 storyboard로 바꾸고 stock footage와 voiceover를 제안·생성한다."}, {"q": "프롬프트로부터 일관되고 고품질의 이미지를 생성하는 텍스트 조건부 이미지 생성에 가장 흔히 사용되는 모델 유형은?", "o": ["변분 오토인코더(Variational Autoencoder)", "생성적 적대 신경망(GAN)", "텍스트 조건부 디퓨전(Text conditioned diffusion)", "대규모 언어 모델(LLM)"], "a": 2, "e": "text-conditioned diffusion model은 noise를 반복적으로 정제해 prompt에 맞는 고품질 image를 생성하는 대표적 방식이다."}, {"q": "데이터가 이름이 정해진 열과 데이터 유형으로 미리 정의된 스키마를 가진 관계형 테이블에 저장되어 있습니다. 이 데이터를 가장 잘 설명하는 범주는?", "o": ["반정형 데이터(Semi-structured Data)", "시계열 데이터(Time Series Data)", "정형 데이터(Structured Data)", "비정형 데이터(Unstructured Data)"], "a": 2, "e": "정해진 column과 data type을 가진 relational table은 schema가 명확한 Structured Data다."}, {"q": "Solara Components는 2019년부터 2023년까지 판매된 제품의 내부 문서와 판매 데이터로 대규모 언어 모델을 파인튜닝했습니다. 직원이 이번 분기에 출시된 새 기기 라인에 대해 물으면 모델은 부정확한 답을 하거나 정보가 없다고 답합니다. 이 동작을 가장 직접적으로 설명하는 파운데이션 모델의 내재적 한계는?", "o": ["환각(Hallucinations)", "분포 외(out-of-distribution) 질의", "모델의 학습 데이터에 대한 의존성", "불공정한 편향(Unfair bias)"], "a": 2, "e": "model은 2019-2023 자료로만 fine-tuning되었으므로 이번 분기 신제품을 알 수 없다. 이는 training data에 의존하는 한계다."}, {"q": "성 중립적인 프롬프트 약 120개로 테스트했을 때, 텍스트-이미지 모델이 전문직 역할에서 일관되게 같은 성별의 이미지를 생성했습니다. 이는 무엇을 가장 직접적으로 나타내나요?", "o": ["높아진 샘플링 temperature", "학습 데이터 이미지의 편향", "생성 시 고정된 랜덤 시드", "작은 프롬프트 컨텍스트 윈도우"], "a": 1, "e": "gender-neutral prompt에서도 특정 gender만 반복 생성되면 training image distribution에 존재하는 bias가 output으로 드러난 것이다."}, {"q": "BrightMarket이라는 국제 이커머스 기업이 제품·지원팀이 안전하게 생성형 어시스턴트를 만들 수 있도록 Google Cloud에 내부 AI 허브를 구축하고 있습니다. 플랫폼팀은 90일 파일럿 기간 동안 8개 사업부의 다중 턴 대화형 에이전트 개발을 가속화하기 위해 Vertex AI Agent Builder를 사용할 계획입니다. 이 목표를 위해 Vertex AI Agent Builder를 평가할 때, 서비스의 내장 기능이나 핵심 구성요소가 아닌 것은?", "o": ["엔터프라이즈 검색을 사용해 에이전트를 사내 콘텐츠에 근거하게 하는 기능", "사용자 수요에 따라 자동으로 확장되는 완전 관리형 서버리스 런타임", "회사 자체 온프레미스 서버에 전체 Vertex AI Agent Builder 플랫폼을 설치할 수 있는 소프트웨어 라이선스", "대화 흐름, 상태 관리, 도구 기반 API 통합을 위한 설계 프레임워크"], "a": 2, "e": "Vertex AI Agent Builder는 Google Cloud의 managed service이며 전체 platform을 on-premises에 설치하는 license를 제공하는 서비스가 아니다."}, {"q": "SkyTrail이라는 중견 여행 예약 회사가 맞춤형 일정을 제공하고 고객 문의를 처리하는 생성형 AI 여행 계획 어시스턴트를 도입하고 있습니다. 경영진은 책임감 있는 설계·배포를 위해 이 노력을 Google의 AI 원칙(AI Principles)에 맞추려 합니다. 이 원칙 아래에서 이 어시스턴트의 주요 목표가 아닌 것은?", "o": ["어시스턴트가 도움을 줄 수 없을 때 사용자가 사람 여행 전문가에게 쉽게 상담을 넘길 수 있는 방법을 제공하는 것", "일정·가격 추천이 여러 사용자에게 공평하도록 불공정한 편향을 줄이는 것", "사용자가 더 오래 머물도록 어시스턴트를 의도적으로 설득력 있게 만들어 참여와 전환을 극대화하는 것", "유해하거나 독성이 있거나 부적절한 응답을 막기 위한 엄격한 안전성 평가를 수행하는 것"], "a": 2, "e": "AI Principles는 safety, fairness, human escalation을 중시한다. 사용자를 더 오래 머물게 하려는 의도적 설득은 primary responsible-AI goal이 아니다."}, {"q": "scrumtuous.com에서 소매 마켓플레이스용 AI 어시스턴트가 공식 정책 문서에 없는 매장 전체 35% 할인을 종종 지어냅니다. 회사는 이 허위 혜택을 그대로 인정해 왔고, 이는 매출을 줄이고 고객을 불만족스럽게 만듭니다. 이 구체적인 재무적 위험을 가장 효과적으로 줄이는 기술적 접근법은?", "o": ["답변 전에 사용자 질문을 분해하는 다단계 프롬프팅을 사용한다.", "Vertex AI Safety Filters", "답변이 승인된 회사 정책 출처로 제한되도록 검색 기반 그라운딩을 구현한다.", "더 많은 일반 지원 대화 데이터셋으로 모델을 파인튜닝한다."], "a": 2, "e": "허위 할인 안내는 approved policy document에 grounding하면 줄일 수 있다. retrieval을 통해 답변 근거를 공식 정책으로 제한해야 한다."}, {"q": "한 구독형 동영상 플랫폼이 시청 장르, 시청 세션 수, 지난 120일간 평균 월 지출 같은 피처를 사용해 시청자를 의미 있는 세그먼트로 나누고 싶어 하며, 이 세그먼트에 대한 기존 라벨은 없습니다. 팀은 콘텐츠 추천과 프로모션을 맞춤화하기 위해 시청자 사이의 자연스러운 군집을 찾고 싶어 합니다. 어떤 머신러닝 접근법을 선택해야 할까요?", "o": ["준지도학습(Semi-supervised Learning)", "강화학습(Reinforcement Learning)", "비지도학습(Unsupervised Learning)", "지도학습(Supervised Learning)"], "a": 2, "e": "label이 없는 viewer data에서 자연스러운 segment를 찾는 것은 clustering을 포함한 Unsupervised Learning의 용도다."}, {"q": "다음 요구사항을 저장소 패러다임에 올바르게 매핑한 선택지를 찾으세요. 첫째는 300TB 규모의 원본 자산 저장소입니다. 둘째는 9년치 정형 이력 데이터를 대상으로 하는 복잡한 쿼리 실행입니다. 셋째는 300ms 이내 응답이 필요한 단건 고객 상태 조회입니다.", "o": ["첫째는 데이터베이스, 둘째는 데이터 웨어하우스, 셋째는 데이터 레이크에 매핑된다.", "첫째는 오브젝트 스토리지, 둘째는 데이터 웨어하우스, 셋째는 키-값 저장소에 매핑된다.", "첫째는 데이터 레이크, 둘째는 데이터 웨어하우스, 셋째는 트랜잭션 데이터베이스에 매핑된다.", "첫째는 데이터 레이크, 둘째는 데이터베이스, 셋째는 데이터 웨어하우스에 매핑된다."], "a": 1, "e": "대규모 raw asset은 Object Storage, 복잡한 historical analytics는 Data Warehouse, 매우 빠른 단건 상태 조회는 Key-value Store가 가장 알맞다."}, {"q": "5일 이내에 최신 생성형 모델을 사용해 코드를 작성하지 않고도 비기술 사용자가 키워드로부터 제품 설명을 생성할 수 있게 해주는 Google Cloud 기능은?", "o": ["Vertex AI Pipelines", "Vertex AI Studio", "Cloud TPU", "Vertex AI Workbench"], "a": 1, "e": "Vertex AI Studio는 비기술 사용자도 prompt와 model parameter를 시험해 content generation prototype을 빠르게 만들 수 있게 한다."}, {"q": "한 대형 보험사가 엄격한 규제 감독 하에 고액 청구건의 결과를 제안하는 생성형 AI 어시스턴트를 시범 운영 중입니다. 경영진은 각 권고사항에 누가 책임을 지는지 명확히 하고 감사자가 시스템이 어떻게 그런 제안에 도달했는지 이해할 수 있도록 하는 프로세스를 요구합니다. 책임성과 이해 가능성에 대한 이러한 강조는 어떤 우선순위를 반영하나요?", "o": ["데이터 저장 비용과 효율성", "AI 책임성(accountability)과 설명 가능성(explainability)", "Vertex AI Model Garden", "모델 추론 속도와 지연시간"], "a": 1, "e": "누가 recommendation에 책임지는지와 왜 그런 제안이 나왔는지를 보여 주는 요구는 AI accountability와 explainability에 해당한다."}, {"q": "BlueWave Media는 120일 내에 생성형 AI 기반 개인화 엔진을 출시할 계획입니다. 비즈니스 분석가들은 가치 있는 사용 사례를 검증했고, 데이터 사이언스 팀은 고객 구독·상호작용 데이터에 대한 합법적 접근을 확인했습니다. 그러나 이 정보는 여러 레거시 저장소에 분산되어 있고, 지역별 형식이 일관되지 않으며, 누락된 속성이 많습니다. 이 데이터를 AI 모델 학습에 적합하게 만들려면, 머신러닝 라이프사이클의 어느 단계가 가장 큰 초기 시간·자원 투자를 필요로 할까요?", "o": ["모델 학습(Model Training)", "데이터 준비(Data Preparation)", "모델 관리(Model Management)", "모델 배포(Model Deployment)"], "a": 1, "e": "여러 legacy source의 format 불일치와 missing value를 해결하려면 cleaning, integration, normalization을 하는 Data Preparation에 가장 큰 초기 노력이 든다."}, {"q": "Seabright Travel은 45초짜리 프로모션 영상을 위한 스토리보드 텍스트, 나레이터 오디오 트랙, 엄선된 브랜드 이미지 세트를 입력받아 이를 모두 결합한 하나의 짧은 영상을 만드는 내부 생성형 도구를 구축하려 합니다. 텍스트·오디오·이미지를 함께 이해해 영상을 생성하려면 어떤 종류의 파운데이션 모델이 필요할까요?", "o": ["장면에 라벨을 붙이도록 학습된 비디오 분류 모델", "단일 모달(unimodal) 대규모 언어 모델", "텍스트, 오디오, 이미지를 통합해 영상을 생성하는 멀티모달 파운데이션 모델", "이미지 전용 디퓨전 모델"], "a": 2, "e": "text, audio, image를 함께 이해하고 video를 생성하려면 여러 modality를 통합하는 multimodal foundation model이 필요하다."}, {"q": "Blue Harbor Learning은 가족을 위한 맞춤형 취침 이야기를 작성하는 생성형 AI 기능을 출시하려 합니다. 선택한 GCP 리전은 실시간 추론에 GPU 6개만 허용하는 할당량을 가지고 있으며, 팀은 매끄러운 경험을 위해 400밀리초 이내 응답을 목표로 합니다. 이 하드웨어 제약이 가장 직접적으로 좌우할 솔루션의 측면은?", "o": ["제품의 출시 전략과 가격 등급", "파운데이션 모델 아키텍처와 매개변수 규모의 선택", "Cloud Firestore 내 사용자 프로필의 문서 스키마와 직렬화 형식", "서브넷 범위와 방화벽 규칙을 포함한 VPC 네트워크 구성"], "a": 1, "e": "GPU quota와 400 ms latency 목표는 inference 비용과 속도에 직접 영향을 주므로 foundation model의 architecture와 parameter scale 선택을 좌우한다."}, {"q": "Google Workspace와 통합되어 Meet에서 생성형 회의 요약을, Gmail·Docs에서 초안 작성 지원을 제공하는 Google Cloud 제품은?", "o": ["Vertex AI Agent Builder", "Vertex AI Studio", "Gemini for Workspace", "독립형 Gemini 앱"], "a": 2, "e": "Gemini for Workspace는 Meet의 meeting summary와 Gmail·Docs의 drafting assistance처럼 Workspace 안의 generative AI 기능을 제공한다."}, {"q": "BigQuery 안에서 SQL 초안 작성, 스키마 해석, 30TB 규모 데이터셋에 대한 인사이트 제안 같은 통합 AI 지원을 제공하는 Google Cloud 기능은?", "o": ["BigQuery Studio", "BigQuery의 Gemini", "Vertex AI Pipelines", "Gemini Code Assist"], "a": 1, "e": "Gemini in BigQuery는 SQL drafting, schema 이해, insight suggestion을 BigQuery workflow 안에서 지원한다."}, {"q": "한 중견 금융 서비스 회사가 규제 보고서와 독점 분석자료를 아우르는 내부 리서치 포털을 구동하기 위해 Vertex AI Search를 배포하고 있습니다. 팀은 엄격한 보안·데이터 거버넌스 요구사항을 충족하면서 빠른 검색을 제공해야 합니다. 이 민감한 환경에서 구성·출시 과정 중 권장되는 보안·거버넌스 관행으로 볼 수 없는 것은?", "o": ["이후 컴플라이언스 검토를 위해 검색 요청과 데이터 접근 이벤트를 기록하도록 Cloud Audit Logs를 켠다.", "검색 색인에 데이터를 제공하는 Cloud Storage·BigQuery 데이터셋 주위에 VPC Service Controls 경계를 적용한다.", "Cloud Storage에 업로드하기 전에 수천만 개의 소스 파일을 사람이 직접 검토·수정하는 작업을 수행한다.", "애플리케이션을 조회할 수 있는 직원 그룹을 제한하도록 IAM 정책으로 접근을 강제한다."], "a": 2, "e": "Audit Logs, VPC Service Controls, IAM은 일반적인 security/governance control이다. 수천만 파일을 사람이 모두 review·redact하는 방식은 비확장적이어서 권장 rollout practice가 아니다."}, {"q": "scrumtuous.com의 제품 지원 분석가가 대규모 언어 모델을 사용해 소셜 게시물을 \"긍정\", \"부정\", \"중립\"으로 태깅합니다. 모델의 동작을 유도하기 위해 분석가는 다음 프롬프트를 작성합니다: 다음 게시물의 감성을 분류하라. 게시물 '새 기능이 마음에 들고 앱이 빨라진 느낌이다' → 감성은 긍정. 게시물 '업데이트가 내 설정을 망가뜨려서 환불을 원한다' → 감성은 부정. 게시물 '배송은 괜찮았고 포장은 평범했다' → 감성은 무엇인가? 여기서 적용되고 있는 프롬프팅 기법은?", "o": ["롤 프롬프팅(Role prompting)", "퓨샷(Few shot) 프롬프팅", "프롬프트 체이닝(Prompt chaining)", "제로샷(Zero shot) 프롬프팅"], "a": 1, "e": "Positive와 Negative라는 input-output example을 먼저 제시한 뒤 새 사례를 분류하게 했으므로 Few-shot prompting이다."}, {"q": "한 글로벌 금융 서비스 기업이 내부 분석가를 위해 시장 동향을 요약하는 데 생성형 AI 모델을 사용합니다. 그런데 모델이 가끔 사실과 다른 정보를 생성합니다. 출력이 정확하고 검증 가능하도록 하기 위해 팀이 도입해야 할 Google Cloud 권장 기법은?", "o": ["프롬프트 엔지니어링", "검색 증강 생성(RAG)", "도메인 특화 데이터로 파인튜닝", "human-in-the-loop(HITL)"], "a": 1, "e": "RAG는 신뢰할 수 있는 최신 market source를 검색해 response에 근거를 제공하므로 factual error를 줄이고 검증 가능성을 높인다."}, {"q": "한 소매 조직이 지역 시장별로 수천 개 상품의 제품 설명을 개인화하는 생성형 AI 솔루션을 배포하려 합니다. 정확하고 문화적으로 적합한 결과를 내는 데 가장 가치 있는 데이터 유형은?", "o": ["창고 위치와 물류 일정", "거래 수준의 판매 데이터", "고객 인구통계·행동 세그먼테이션 데이터", "PDF 형식의 내부 감사 보고서"], "a": 2, "e": "지역별로 관련성 있는 description을 만들려면 고객의 demographic과 behavioral segmentation data가 문화적·선호도 맥락을 제공한다."}, {"q": "한 AI 팀이 재무 분석가를 지원하는 생성형 모델을 배포했지만, 규제 관련 시나리오에서 일관되지 않은 출력과 엣지 케이스 오류를 겪고 있습니다. 자동화와 사람의 감독을 가장 잘 결합해 높은 신뢰성과 리스크 통제를 보장하는 사전 예방적 완화 전략은?", "o": ["생성 시간을 줄이기 위해 토큰 수를 줄인다.", "구조화된 템플릿을 사용하는 프롬프트 엔지니어링", "human-in-the-loop(HITL) 검토 시스템 도입", "사전 승인된 정책 문서로 모델을 근거하게 한다."], "a": 2, "e": "규제 edge case에서 오류가 날 수 있는 high-risk financial analysis는 automation만으로 끝내지 말고 HITL review로 사람이 확인·승인해야 한다."}, {"q": "한 헬스케어 기업이 다양한 환자 인구통계 집단에서 자사 gen AI 진단 어시스턴트의 성능을 평가하고 있습니다. 모델 학습에 저품질 또는 비대표적인 데이터를 사용할 때의 주요 함의는?", "o": ["모델이 지나치게 광범위하게 일반화되어 창의성은 높아지지만 통제력은 낮아질 수 있다.", "동등한 성능을 달성하기 위해 파인튜닝 시 더 많은 컴퓨팅 파워가 필요할 수 있다.", "모델이 불공평한 결과를 낼 수 있으며 대표성이 낮은 집단에 불균형적으로 영향을 미칠 수 있다.", "비효율적인 색인화로 인해 추론 시간이 느려질 수 있다."], "a": 2, "e": "low-quality 또는 non-representative training data는 일부 demographic에서 더 큰 오류와 불리한 결과를 낳아 inequitable outcome으로 이어질 수 있다."}, {"q": "한 제조기업이 재고 추적, 컴플라이언스 문서화 같은 내부 업무를 자동화하는 맞춤형 AI 어시스턴트를 구축하려 합니다. 사전학습된 기능을 활용하면서도 모델 동작에 대한 최대한의 통제력을 얻으려면 생성형 AI 생태계의 어느 계층에 집중해야 할까요?", "o": ["인프라 계층 - 컴퓨팅과 스토리지 비용 최적화를 위해", "애플리케이션 계층 - 완제품 AI 어시스턴트를 바로 배포하기 위해", "파운데이션 모델 계층 - 사내 데이터로 모델을 처음부터 사전학습하기 위해", "모델 커스터마이징 계층 - 사내 용도로 기반 모델을 파인튜닝하거나 프롬프트 튜닝하기 위해"], "a": 3, "e": "Model customization layer에서는 pre-trained base model을 fine-tune하거나 prompt-tune해 내부 업무에 맞추며, 처음부터 학습하지 않고도 behavior control을 높인다."}, {"q": "한 기업이 비즈니스 운영을 강화하기 위해 생성형 AI 도입을 검토 중이지만 특정 공급업체에 종속되는 것(vendor lock-in)을 피하고 싶어 합니다. 경영진은 전략이 진화함에 따라 다양한 AI 도구·플랫폼을 도입·통합할 수 있는 유연성을 중시합니다. 이 우선순위와 가장 잘 부합하는 Google Cloud AI 오퍼링의 핵심 원칙은?", "o": ["긴밀하게 통합된 독점 AI 솔루션에 대한 Google Cloud의 전념", "엔드투엔드 AI 워크플로우 자동화에 대한 Google Cloud의 주력", "AI 제공에 있어 개방형(open) 접근 방식을 강조하는 Google Cloud", "사용자 경험 단순화를 위해 완전관리형 AI 서비스를 우선시하는 Google Cloud의 전략"], "a": 2, "e": "여러 도구·platform을 유연하게 통합하고 vendor lock-in을 줄이려는 요구는 Google Cloud AI offering의 open approach와 맞는다."}, {"q": "한 기업의 CIO가 장기적인 생성형 AI 도입을 지원할 인재 로드맵을 설계하고 있습니다. 확장 가능하고 지속 가능한 내부 역량을 구축하는 데 가장 효과적인 조치는?", "o": ["현재 워크플로우를 조정하지 않고 모든 사업부에 생성형 AI 도구 도입을 의무화한다.", "모든 연구개발을 내부화하기 위해 소수의 AI 박사급 인력 팀을 채용한다.", "내부 교육 부담을 줄이기 위해 모든 AI 모델 개발을 외부 업체에 아웃소싱한다.", "부서 간 AI 활성화 프로그램을 마련하고 현업 전문가를 AI 챔피언으로 육성한다."], "a": 3, "e": "cross-functional enablement와 domain expert upskilling은 현업에 AI capability를 넓게 퍼뜨려 장기적으로 지속 가능한 내부 역량을 만든다."}, {"q": "AI 에이전트의 정의는 무엇인가요?", "o": ["주어진 입력과 사용 가능한 도구를 바탕으로 목표를 달성하는 방법을 학습하는 애플리케이션", "gen AI 애플리케이션의 운영을 감독·관리하는 인간 전문가", "사용자가 gen AI 애플리케이션과 상호작용할 수 있게 해주는 사용자 인터페이스의 한 유형", "사용자에게 정보를 제공하는 gen AI 애플리케이션의 정적 구성요소"], "a": 0, "e": "AI agent는 input과 사용할 tool을 바탕으로 goal을 달성하는 방법을 학습·계획하는 application이다."}, {"q": "한 기업이 비디오 게임용 AI 캐릭터를 개발하고 있습니다. 이 AI 캐릭터는 복잡한 환경을 탐색하고 게임 내 특정 목표를 달성하기 위한 결정을 내리도록 학습해야 합니다. 보상을 찾거나 장애물을 극복하는 등 긍정적인 결과로 이어지는 행동을 하면 양(+)의 점수를 받고, 벽에 부딪히거나 진행 상황을 잃는 등 부정적인 결과로 이어지는 행동을 하면 음(-)의 점수를 받습니다. 이러한 시행착오 과정을 통해 AI는 점차 캐릭터가 게임을 더 효과적으로 플레이하는 능력을 향상시킵니다. 어떤 머신러닝을 사용해야 할까요?", "o": ["비지도학습(Unsupervised learning)", "강화학습(Reinforcement learning)", "지도학습(Supervised learning)", "딥러닝(Deep learning)"], "a": 1, "e": "행동 결과에 positive·negative reward를 받고 trial and error로 policy를 개선하는 방식은 Reinforcement Learning이다."}, {"q": "한 연구팀이 다양한 산업용 기계에서 나온 대규모 센서 판독값 데이터셋을 수집했습니다. 이 데이터셋에는 온도, 압력, 진동 수준, 전류 등이 일정 간격으로 기록되어 있습니다. 팀은 아직 이 판독값에 라벨이나 범주를 부여하지 않았으며, 센서 데이터만으로 잠재적인 이상 징후, 오작동, 또는 기계 동작의 자연스러운 군집을 찾아내고 싶어 합니다. 어떤 유형의 머신러닝을 사용해야 할까요?", "o": ["딥러닝(Deep learning)", "강화학습(Reinforcement learning)", "지도학습(Supervised learning)", "비지도학습(Unsupervised learning)"], "a": 3, "e": "sensor data에 label이 없고 anomaly나 natural grouping을 찾으려 하므로 Unsupervised Learning이 맞다."}, {"q": "비지도 머신러닝의 예시는 무엇인가요?", "o": ["과거 갱신 상태 데이터를 바탕으로 구독 갱신 여부를 예측하는 것", "라벨링된 범주를 사용해 제품 이미지를 인식하도록 시스템을 학습시키는 것", "고객 구매 패턴을 분석해 자연스러운 군집을 찾아내는 것", "과거 매출과 마케팅 지출을 사용해 매출을 예측하는 것"], "a": 2, "e": "label 없이 customer purchase pattern의 natural grouping을 찾는 것은 clustering 형태의 Unsupervised Learning 예시다."}, {"q": "디퓨전 모델은 무엇을 하나요?", "o": ["노이즈를 정제해 구조화된 데이터로 만들어 고품질 콘텐츠를 생성한다.", "구조화된 데이터의 저장과 관리를 돕는다.", "데이터를 분석해 향후 추세와 패턴을 예측한다.", "비즈니스 프로세스와 자원 배분을 최적화한다."], "a": 0, "e": "diffusion model은 noise에서 시작해 반복적으로 structured signal을 복원하여 high-quality content를 생성한다."}, {"q": "한 조직이 고객 서비스용 생성형 AI 모델을 학습시키기 위해 데이터를 수집하고 있습니다. ML 라이프사이클 전반의 보안을 보장하려 합니다. 이 단계에서 중요한 고려사항은 무엇인가요?", "o": ["AI 모델에 최신 소프트웨어 패치를 정기적으로 적용한다.", "예상치 못한 출력과 잠재적 오류를 모니터링하기 위해 AI 모델의 성능을 감시한다.", "공정성을 보장하고 피해를 방지하기 위한 AI 모델 응답의 윤리 지침을 수립한다.", "학습 데이터 내 접근 통제를 구현하고 민감 정보를 보호한다."], "a": 3, "e": "customer service training data에는 민감 정보가 있을 수 있으므로 access control과 sensitive information 보호가 data collection 단계의 핵심 보안 고려사항이다."}, {"q": "지도 머신러닝의 예시는 무엇인가요?", "o": ["과거의 라벨링된 지원 티켓을 사용해 해결 시간을 예측하는 모델을 구축하는 것", "구매 이력을 사용해 알려지지 않은 고객 세그먼트를 파악하는 것", "웹사이트 클릭을 분석해 사용자 행동 군집을 찾아내는 것", "고객 리뷰를 검토해 반복되는 주제를 자동으로 파악하는 것"], "a": 0, "e": "과거 support ticket에 input feature와 실제 resolution time이라는 label이 함께 있으므로 이를 예측하는 것은 Supervised Learning이다."}, {"q": "한 물류회사가 창고 전반의 실시간 재고 수준을 자동으로 확인하고 배송 일정을 조정하는 생성형 AI(gen AI) 에이전트를 사용하려 합니다. 이 에이전트는 내부 재고 데이터에 접근해야 합니다. 가장 비용 효율적인 솔루션을 원합니다. 조직은 무엇을 해야 할까요?", "o": ["gen AI 에이전트 대신 맞춤 API를 구축한다.", "재고 관련 질문에 사전 구축된 gen AI 챗봇을 사용한다.", "Vertex AI Studio를 사용해 샘플 재고 데이터로 모델을 파인튜닝한다.", "Google Cloud 데이터베이스와 Vertex AI를 사용해 에이전트가 실시간 데이터를 가져오게 한다."], "a": 3, "e": "inventory와 schedule은 실시간으로 변하므로 agent가 Google Cloud database의 live data를 Vertex AI를 통해 조회하도록 하는 것이 비용 효율적이다."}, {"q": "한 영업 매니저가 기존 업무 효율을 높이기 위해 생성형 AI(gen AI)를 책임감 있게 활용하려 합니다. 영업팀이 고객 관계 구축과 거래 성사에 집중할 수 있도록 하고 싶습니다. 영업팀은 gen AI를 어떻게 사용해야 할까요?", "o": ["더 직관적이고 사용하기 쉬운 인터페이스로 영업팀의 CRM 시스템을 대체하는 데 사용한다.", "소셜미디어의 고객 상호작용을 분석해 공개 프로필에 맞춘 영업 문구를 자동 생성하는 데 사용한다.", "이메일 초안을 작성하고 고객 니즈에 대한 실시간 통찰을 제공하는 데 사용한다.", "블로그 게시물, 소셜미디어 업데 /* ===== 상태 ===== */
let cfg={count:207,mode:"instant",shuffle:true};
let order=[], idx=0, answers=[], revealed=[];

function bindSeg(id,key,parse){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); cfg[key]=parse(b.dataset.v);
    };
  });
}
bindSeg('seg-count','count',v=>+v);
bindSeg('seg-mode','mode',v=>v);
bindSeg('seg-shuffle','shuffle',v=>v==='1');

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function buildOrder(){
  let ids=[...Array(BANK.length).keys()];
  if(cfg.shuffle) shuffle(ids);
  ids=ids.slice(0,Math.min(cfg.count,BANK.length));
  return ids.map(i=>{
    const B=BANK[i];
    const correct=Array.isArray(B.a)?B.a:[B.a];
    let opts=B.o.map((t,oi)=>({t,correct:correct.includes(oi)}));
    if(cfg.shuffle) shuffle(opts);
    const correctIdxs=opts.map((o,k)=>o.correct?k:-1).filter(k=>k>=0);
    return {q:B.q,e:B.e,multi:!!B.multi,opts,correctIdxs};
  });
}

function startExam(){
  order=buildOrder(); idx=0;
  answers=new Array(order.length).fill(null);
  revealed=new Array(order.length).fill(false);
  document.getElementById('start').classList.add('hide');
  document.getElementById('result').classList.add('hide');
  document.getElementById('quiz').classList.remove('hide');
  renderQ();
}
function retry(){ startExam(); }

function renderQ(){
  const item=order[idx];
  document.getElementById('qcount').textContent=`문제 ${idx+1} / ${order.length}`;
  document.getElementById('modeLabel').textContent=cfg.mode==='instant'?'학습 모드':'실전 모드';
  document.getElementById('prog').style.width=(idx/order.length*100)+'%';
  document.getElementById('qtext').textContent=item.q;
  document.getElementById('hint').textContent=item.multi?'✓ 정답 2개를 선택하세요':'';
  const wrap=document.getElementById('choices'); wrap.innerHTML='';
  const ex=document.getElementById('explain'); ex.className='explain'; ex.innerHTML='';

  const sel=answers[idx];
  const selArr=Array.isArray(sel)?sel:(sel===null?[]:[sel]);
  const revealedNow=item.multi?revealed[idx]:(sel!==null&&cfg.mode==='instant');
  const letters=['A','B','C','D','E'];

  item.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.innerHTML=`<span class="dot">${letters[i]}</span><span>${o.t}</span>`;
    if(revealedNow){
      btn.disabled=true;
      if(item.correctIdxs.includes(i)) btn.classList.add('correct');
      else if(selArr.includes(i)) btn.classList.add('wrong');
    } else if(selArr.includes(i)) btn.classList.add('sel');
    btn.onclick=()=>choose(i);
    wrap.appendChild(btn);
  });

  if(revealedNow) showExplain();

  const nb=document.getElementById('nextBtn');
  let show=false,label='',handler=null;
  const last=(idx===order.length-1);
  if(item.multi){
    if(cfg.mode==='instant' && !revealed[idx]){
      if(selArr.length>0){show=true;label='정답 확인';handler=checkMulti;}
    } else if(selArr.length>0){show=true;label=last?'채점하기':'다음';handler=nextQ;}
  } else if(sel!==null){show=true;label=last?'채점하기':'다음';handler=nextQ;}
  if(show){nb.classList.remove('hide');nb.textContent=label;nb.onclick=handler;}
  else nb.classList.add('hide');
}

function choose(i){
  const item=order[idx];
  if(item.multi){
    if(revealed[idx]) return;
    let arr=Array.isArray(answers[idx])?answers[idx].slice():[];
    if(arr.includes(i)) arr=arr.filter(x=>x!==i);
    else { if(arr.length>=item.correctIdxs.length) arr.shift(); arr.push(i); }
    answers[idx]=arr; renderQ();
  } else {
    if(answers[idx]!==null && cfg.mode==='instant') return;
    answers[idx]=i; renderQ();
  }
}
function checkMulti(){ revealed[idx]=true; renderQ(); }

function showExplain(){
  const item=order[idx], ex=document.getElementById('explain');
  let ok;
  if(item.multi){
    const s=Array.isArray(answers[idx])?answers[idx]:[];
    ok=s.length===item.correctIdxs.length && item.correctIdxs.every(c=>s.includes(c));
  } else ok=answers[idx]===item.correctIdxs[0];
  ex.className='explain show '+(ok?'ok':'no');
  const letters=['A','B','C','D','E'];
  const ans=item.correctIdxs.map(k=>letters[k]+'. '+item.opts[k].t).join('<br>');
  ex.innerHTML=`<b>${ok?'✅ 정답입니다':'❌ 오답입니다'}</b>
    <span class="ans">정답: ${ans}</span>
    <div style="margin-top:8px">${item.e}</div>`;
}

function nextQ(){
  if(idx<order.length-1){ idx++; renderQ(); } else finish();
}

function isCorrect(it,ans){
  if(it.multi){
    const s=Array.isArray(ans)?ans:[];
    return s.length===it.correctIdxs.length && it.correctIdxs.every(c=>s.includes(c));
  }
  return ans===it.correctIdxs[0];
}

function finish(){
  let c=0;
  order.forEach((it,i)=>{ if(isCorrect(it,answers[i])) c++; });
  const total=order.length, pct=Math.round(c/total*100), pass=pct>=75;
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('result').classList.remove('hide');
  document.getElementById('ring').style.background=`conic-gradient(${pass?'#188038':'#e37400'} ${pct}%, #e8ebf3 0)`;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('ratio').textContent=`${c} / ${total}`;
  const v=document.getElementById('verdict');
  v.textContent=pass?'🎉 합격 기준 통과!':'📚 조금 더 복습이 필요해요';
  v.className='verdict '+(pass?'pass':'fail');
  document.getElementById('nCorrect').textContent=c;
  document.getElementById('nWrong').textContent=total-c;

  const rev=document.getElementById('review'); rev.innerHTML='';
  const wrongs=order.map((it,i)=>({it,i})).filter(x=>!isCorrect(x.it,answers[x.i]));
  if(wrongs.length){
    const h=document.createElement('h3'); h.textContent=`오답 리뷰 (${wrongs.length}문항)`; rev.appendChild(h);
    wrongs.forEach(({it,i})=>{
      const ans=answers[i];
      const your=(ans===null||(Array.isArray(ans)&&!ans.length))?'(미응답)':
        (Array.isArray(ans)?ans.map(k=>it.opts[k].t).join(' / '):it.opts[ans].t);
      const right=it.correctIdxs.map(k=>it.opts[k].t).join(' / ');
      const d=document.createElement('div'); d.className='rev-item';
      d.innerHTML=`<div class="q">Q. ${it.q}</div>
        <div class="yours">✗ 내 답: ${your}</div>
        <div class="right">✓ 정답: ${right}</div>
        <div class="ex">${it.e}</div>`;
      rev.appendChild(d);
    });
  }else{
    const h=document.createElement('h3'); h.textContent='완벽합니다! 오답이 없어요 👏'; rev.appendChild(h);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
